<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>页面不存在 · 霞光预报</title>
<meta name="description" content="你访问的地址没有对应的页面。返回霞光预报首页，查询朝霞与晚霞的出现概率与观赏质量。">
<!-- 404 页**必须** noindex：它会被托管平台拿去应答**任意**未知路径（包括爬虫顺着
     外链摸过来的各种拼错地址），放进索引等于给站点造出一批空壳收录。 -->
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f4f6fa">
<!-- 图标两个占位符由 assemble.py 注入，与主页同一枚图标（SVG 给浏览器，
     PNG 给 iOS —— iOS 不支持 SVG 格式的 apple-touch-icon）。 -->
<link rel="icon" type="image/svg+xml" href="__ICON_SVG__">
<link rel="apple-touch-icon" sizes="180x180" href="data:image/png;base64,__ICON_PNG180__">
<style>
/* ---- 设计令牌：与 tpl/template.html 的 :root **逐字一致** ----
   404 页会被套在任意路径下返回，但它看上去必须跟主页是同一个站点。
   所以这里不新造颜色，只抄；改配色时两边一起改。 */
:root{
  --bg:#f4f6fa; --card:#ffffff; --line:#e5e9f0; --line2:#eef1f6;
  --tx:#1f2733; --tx2:#5b6675; --tx3:#667081;
  --ok:#0f7a45; --okbg:#e9f7ef;
  --warn:#9c5a09; --warnbg:#fdf3e3;
  --bad:#c0392b; --badbg:#fdeceb;
  --acc:#e2601f; --acc2:#bd4a17; --accbg:#fff3ec;
  --blue:#2563eb; --bluebg:#eef3ff;
  --r:14px; --r2:10px;
  --sh:0 1px 2px rgba(16,24,40,.04), 0 6px 20px -8px rgba(16,24,40,.10);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1200px 380px at 12% -8%, #ffeede 0%, rgba(255,238,222,0) 62%),
    radial-gradient(1000px 340px at 92% -6%, #e9f0ff 0%, rgba(233,240,255,0) 60%),
    var(--bg);
  color:var(--tx);
  font:15px/1.62 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:1560px;margin:0 auto;padding:0 16px 48px}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:.2px}
a{color:var(--blue)}
.mono{font-family:var(--mono)}

/* ---------- 顶部（与主页同一段，逐字复用） ---------- */
.top{position:sticky;top:0;z-index:60;backdrop-filter:saturate(1.4) blur(10px);
  background:rgba(255,255,255,.86);border-bottom:1px solid var(--line)}
.top-in{max-width:1560px;margin:0 auto;padding:11px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{width:34px;height:34px;border-radius:11px;flex:0 0 auto;
  background:linear-gradient(150deg,#ffd08a,#f08a3c 46%,#c9501a);box-shadow:0 4px 12px -4px rgba(201,80,26,.55)}
.top h1{font-size:17.5px;line-height:1.25}
.top .sub{font-size:12px;color:var(--tx3);margin-top:1px}
/* 标题列必须 min-width:0（与主页同一条纪律）：h1 是 nowrap，其 min-content 等于
   整行标题宽，缺它标题列不许收缩，会把 badge 顶出容器右缘 → 页面 scrollWidth 变大。 */
.top-tx{min-width:0}
.top .spacer{flex:1 1 auto}
.badge{font-size:11.5px;padding:4px 9px;border-radius:999px;background:var(--accbg);color:var(--acc2);border:1px solid #ffd9c2;white-space:nowrap}

/* ---------- 通用卡片（同主页 .card） ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px}
.hint{font-size:12.5px;color:var(--tx3);line-height:1.6}

/* ---------- 404 本体 ---------- */
/* 窄栏居中：这页内容就一块，撑满 1560 会让"返回首页"跑到屏幕边上找不着。 */
.nf{max-width:640px;margin:40px auto 0;text-align:center;padding:26px 22px 22px}
/* 数字用 --acc2 而不是 --acc：--acc(#e2601f) 是给色块/渐变用的，白底上做文字
   对比度不够；--acc2(#bd4a17) 白底约 5.1，大字也稳稳过线。
   用等宽字体是刻意的：404 是**数字**，换成正文衬线会跟后面的标题抢注意力。 */
.nf-code{font-family:var(--mono);font-size:62px;line-height:1;font-weight:800;
  letter-spacing:2px;color:var(--acc2)}
.nf h2{font-size:20px;margin-top:12px}
.nf-lead{font-size:14px;color:var(--tx2);margin:10px 0 0}
/* 请求路径：可能很长且不含空格（/a/b/c?x=……），必须允许在任意字符处断行，
   否则窄屏上它会把卡片撑破、把页面 scrollWidth 顶出去。 */
.nf-path{margin:12px 0 0;font-size:12.5px;color:var(--tx3);
  word-break:break-all;overflow-wrap:anywhere}
.nf-path code{font-family:var(--mono);background:var(--line2);border-radius:6px;padding:2px 6px}
.acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:42px;padding:10px 18px;border-radius:var(--r2);border:1px solid var(--line);
  background:#fff;color:var(--tx);font-weight:600;font-size:15px;text-decoration:none;
  transition:.15s;cursor:pointer;font-family:inherit}
.btn:hover{border-color:#d6dbe4;background:#fafbfd}
/* 主按钮白字压在 --acc2 上 ≈ 5.06（≥4.5）；压在 --acc 上只有 ≈3.4，不够。 */
.btn.pri{background:var(--acc2);border-color:var(--acc2);color:#fff}
.btn.pri:hover{background:#a63f12;border-color:#a63f12;color:#fff}
.btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
/* 作者样式里的 display 会盖掉 [hidden] 的 UA display:none，必须自己钉死。 */
[hidden]{display:none!important}
.nf-foot{margin:16px 0 0}

/* ---------- 手机端（断点与主页同为 760px，三处之一） ----------
   顶部条的压法与主页**完全一致**（sub 隐藏 / h1 14px / badge 同行 /
   logo 26 / sticky 改 static），理由见主页那段注释：压薄后的 sticky 条
   会半透明浮在内容上、把下面那行截断。 */
@media (max-width:760px){
  .top{position:static}
  .top-in{padding:8px 11px;gap:8px;flex-wrap:nowrap}
  .logo{width:26px;height:26px;border-radius:9px}
  .top h1{font-size:14px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .top .sub{display:none}
  .top .spacer{flex:1 1 0;min-width:0}
  .badge{flex:0 0 auto;font-size:11px;padding:3px 8px}
  .nf{margin-top:20px;padding:20px 16px 18px}
  .nf-code{font-size:46px}
  .nf h2{font-size:17px}
  /* 竖排通栏：两个按钮横排在 360px 屏上会挤成 158px 宽，"返回上一页"五个字
     加内边距正好折行，看起来像坏了。竖排后拇指也好点。 */
  .acts{flex-direction:column;align-items:stretch}
  .btn{width:100%}
}
</style>
</head>
<!-- data-home 由 assemble.py 注入站点根路径（默认 "/"）。
     为什么不能写相对地址 "index.html"：404 页是在**请求的那个 URL**下返回内容，
     相对地址会按 /foo/bar 解析成 /foo/index.html —— 越深的错链错得越离谱。
     写死 "/" 又照顾不到部署在子路径下的站点（GitHub Pages 项目页），
     所以跟地图代理一样走"构建期注入"这条路。 -->
<body data-home="__SITE_BASE__">

<div class="top">
  <div class="top-in">
    <div class="logo" aria-hidden="true"></div>
    <div class="top-tx">
      <h1>霞光预报 · 朝霞 / 晚霞 概率与观赏质量</h1>
      <div class="sub">多模型融合（GFS · ECMWF-IFS · 光追算法）+ 火烧云三角几何模型 + 大气消光光谱计算</div>
    </div>
    <div class="spacer"></div>
    <div class="badge">404 · 页面不存在</div>
  </div>
</div>

<main class="wrap">
  <div class="card nf">
    <div class="nf-code" aria-hidden="true">404</div>
    <h2>找不到这个页面</h2>
    <p class="nf-lead">这个地址没有对应的页面 —— 可能是链接过期、地址输错，或者页面已经挪走了。</p>
    <p class="nf-path" id="missPath" hidden>请求的地址：<code class="mono" id="missPathTx"></code></p>

    <div class="acts">
      <!-- 主出口是**真链接**：没有 JS 也能回首页（404 页被各种奇怪客户端打开过，
           不能把唯一出路挂在一个 script 上）。 -->
      <a class="btn pri" href="__SITE_BASE__" id="btnHome">返回首页</a>
      <!-- 次出口相反：它只有在 JS 确认"确实有上一页"时才显形，见下面那段脚本。 -->
      <button type="button" class="btn" id="btnBack" hidden>返回上一页</button>
    </div>

    <p class="hint nf-foot">回首页后可以重新选地点与日期，查询朝霞 / 晚霞的出现概率与观赏质量。</p>
  </div>
</main>

<script>
/* 404 页的 JS 只有两件事，都很小，**刻意不引任何库**：这页要在任意路径下被
   返回，多一个外部依赖就多一处"加载不到就整页失效"。
   1) 把请求到的地址显示出来（用 textContent，绝不拼 innerHTML —— 路径是
      用户可控输入，拼进去就是一个反射型 XSS）。
   2) 只在**真的有上一页**时才放出「返回上一页」。history.length 是唯一能拿到的
      信号（浏览器不允许读历史内容），刚开的新标签页是 1 —— 那时这个按钮
      点下去会把人扔回一个空白页，不如不给。 */
(function () {
  var home = document.body.getAttribute("data-home") || "/";
  var p = location.pathname + (location.search || "");
  var box = document.getElementById("missPath");
  var tx = document.getElementById("missPathTx");
  if (box && tx && p) { tx.textContent = p; box.hidden = false; }
  var back = document.getElementById("btnBack");
  if (back && history.length > 1) {
    back.hidden = false;
    back.addEventListener("click", function () {
      // 再判一次：从进页面到点击之间，历史可能被别的操作改短了。
      if (history.length > 1) history.back();
      else location.href = home;
    });
  }
})();
</script>
</body>
</html>
