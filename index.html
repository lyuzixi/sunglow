模式数据…":"Fetching ECMWF model data…","正在取气溶胶数据…":"Fetching aerosol data…","正在计算 {n} 个网格点…":"Computing {n} grid points…",今天:"Today",明天:"Tomorrow",单位:"Units",公制:"Metric",英制:"Imperial",显示:"Display",数值直标:"Numeric labels",采样点:"Sample points",遮挡层:"Occlusion layer",遮挡:"Occlusion",参考模型:"Reference model",两模型差:"Model gap",连续:"continuous","参考（5 因子）":"Reference (5-factor)",不烧:"No glow",小烧:"Small",中烧:"Medium",大烧:"Great",通透:"Clear path",轻度遮挡:"Slight",明显遮挡:"Marked",严重遮挡:"Heavy","说明 · 色面、遮挡与可信度怎么读":"Note · Reading the field, occlusion and confidence","换地点或换日期都要点「加载地图」才取数，页面不会自动请求，以免消耗额度。":'Changing place or date requires pressing "Load map"; nothing is fetched automatically, to save quota.',"勾上「采样点」会标出全部采样落点：色面是插出来的，点才是实测。点上的颜色与脚下色面一致，正是插值忠实过点的证据。":'Tick "Sample points" to show every measured location: the field is interpolated and then lightly smoothed for display; the number on a dot is the raw measurement. Click a dot to read its exact value.',"色面用固定 0–100 绝对刻度，不随当天数据拉伸，所以不同日期、不同地点的颜色可以直接比较：蓝紫＝基本不烧，绿黄＝小烧，橙红＝中烧到大烧，品红＝世纪大烧。":"The field uses a fixed 0–100 absolute scale, never stretched to the day's data, so colours stay comparable across dates and places: violet/blue = barely burns, green/yellow = small, orange/red = medium to large, magenta = once in a decade.","色面越淡越不可信：离最近采样点越远（超过 60 km 起衰减，300 km 外完全淡出），颜色就越淡越灰。淡不等于弱，是「不知道」——所以色面会一直铺到视口外，而不是在一圈边界上突然断掉。":"Fainter means less certain: the field starts fading beyond 60 km from the nearest sample and reaches zero at 300 km. Faint does not mean weak — it means unknown. That is why the field runs past the viewport edge instead of stopping at a visible boundary.","遮挡层画的是「上游光路被挡」的程度，只在中高值区出现：太阳来向上低云/中云越多，越挡光。默认关闭，要查细节再自己打开。":"The occlusion layer shows how much the upstream light path is blocked, and only where the field is mid-to-high: more low/mid cloud toward the sun means more blocking. Off by default — turn it on to inspect details.",等值线:"Isolines",经纬网:"Graticule","12 小时制":"12-hour clock",偏好存:"Preferences stored in",朝:"Dawn",晚:"Dusk",条实算结果:"computed rows",重新加载趋势:"Reload Trend",加载趋势:"Load Trend","观赏质量分（右列）":"Quality score (right column)","趋势需要一次性取 34 个坐标 × 10 天数据（约 102 次加权调用），点击「加载趋势」显式触发。":"Trend needs a one-shot fetch of 34 coordinates × 10 days (about 102 weighted calls). Click “Load Trend” to trigger explicitly.",云量类型与覆盖度:"Cloud Cover & Type",云底高度:"Cloud Base Height",光学等效地表高度:"Optical Effective Ground Height",等效云底高度:"Effective Cloud Base",云边界距离:"Cloud Edge Distance",光路上游低层云遮挡:"Upstream Low-Cloud Block","气溶胶光学厚度 AOD":"Aerosol Optical Depth (AOD)",能见度:"Visibility","2m 相对湿度":"2m Relative Humidity",气压稳定性:"Pressure Stability",云边界风速分量:"Cloud-Edge Wind Component",对流活动:"Convection","云量偏少，可能没有足够云体承接霞光。":"Cover is low — there may not be enough cloud to catch the glow.","云量接近全覆盖，阳光难以穿透，易形成闷烧或无霞。":"Cover is near-total; sunlight can hardly penetrate — muted burn or none.","云量处于理想区间，云块之间既能透光又能承接低角度阳光。":"Cover is ideal — gaps let light through while clouds catch low-angle sun.",成立:"valid",不成立:"invalid","本项数据缺失。":"This factor is missing.","13 项判据":"13 criteria",有利:"favourable",中性:"neutral",不利:"unfavourable",数据缺失:"no data",数据不足:"insufficient data",无明显云边界:"no clear cloud edge",模式一致性:"Model agreement","（上限 {v}）":" (max {v})","{type}属{deck}，云底约 {base}。{tail}":"{type} — {deck} cloud, base about {base}. {tail}","云底越高，霞光可出现的范围与色相变化越丰富；云底越低，霞光越局限于橘红且持续时间短。":"The higher the base, the wider the glowing area and the richer the hue range; a low base confines the glow to orange-red and shortens it.","气溶胶把光线“垫高”的等效地表高度，由 AOD 与气溶胶标高 Hs={v} km 计算（z=Hs·ln(AOD/(Hs·k₀))）。该值越大，等效云底越低，霞光越难形成。":"Optical equivalent ground height — how much aerosols lift the light path. Computed from AOD and the aerosol scale height Hs={v} km (z=Hs·ln(AOD/(Hs·k₀))). The larger it is, the lower the effective cloud base and the harder the glow is to form.","云底高度减去光学等效地表高度后的有效高度，是几何判定的真正输入。":"Cloud base minus the optical equivalent ground height; this effective height is the real input to the geometry test.","沿日出/日落方位以 25 km 间隔采样（地图批量估算时以采样网格插值代替实地采样）得到的云盘外缘距离。必须小于霞光深入距离 2√(2Rh)，阳光才能从云底下方照进来；距离越远，颜色越红、开始越晚。":"Distance to the outer edge of the cloud deck, sampled every 25 km along the sunrise/sunset azimuth (the map estimates it by interpolating the sample grid). It must be smaller than the maximum glow reach 2√(2Rh) for sunlight to get in under the cloud base; the farther it is, the redder and later the glow.","低云位于霞光光路下方，是最常见的“翻车”原因：低云量高会把阳光彻底挡住。":"Low cloud sits below the light path and is the most common reason a forecast fails: heavy low cloud blocks the sunlight completely.","气溶胶很少，瑞利散射占主导，阳光颜色纯净、饱和度高，水晶天。":"Very little aerosol, so Rayleigh scattering dominates: clean, saturated colours — a crystal-clear sky.","气溶胶一般，天空通透度普通，颜色饱和度会略降。":"Moderate aerosol; transparency is average and colour saturation drops a little.","气溶胶较多，天空偏霾，会明显削弱霞光的亮度与饱和度。":"Fairly heavy aerosol; the sky is hazy, which clearly cuts the glow's brightness and saturation.","气溶胶大量存在，属“污烧”，低角度霞光细节会被灰霾吞掉。":'Heavy aerosol — a "dirty burn": haze swallows the low-angle detail of the glow.',"反映底层大气通透程度。能见度低于 5 km 时地面附近霾/雾显著，霞光的低角度部分会被遮挡。":"Reflects how clear the lower atmosphere is. Below 5 km, haze or fog near the ground is significant and blocks the low-angle part of the glow.","湿度适中利于云的存在与散射；相对湿度过高（>90%）会形成雾并放大气溶胶消光，反而使天空浑浊；过低则可能没有云。":"Moderate humidity helps clouds exist and scatter light; above 90% it forms fog and amplifies aerosol extinction, muddying the sky, while too low leaves no cloud at all.","气压稳定说明天气系统移动缓慢，云边界位置可预测；气压快速变化意味着云况随时可能改变，预报不确定性大。":"Stable pressure means the weather system is moving slowly and the cloud edge stays predictable; rapid change means the cloud field can shift at any moment, so the forecast is less certain.","云边界沿日出/日落方向的速度分量。经验上 <15 m/s 云边界位置不确定度小，>30 m/s 则很大（云边界会明显推移）。":"The wind component along the sunrise/sunset direction at the cloud edge. Empirically, below 15 m/s the edge position is fairly certain; above 30 m/s it is very uncertain (the edge visibly shifts).","对流强时局地积云/积雨云发展，会随机遮挡光路；但积雨云云砧本身也可能形成漂亮的云砧晚霞。":"Strong convection builds local cumulus or cumulonimbus that can block the path at random — but the anvil itself can also make a spectacular anvil sunset."," · 降水 {v} mm":" · precip {v} mm",两方面分歧都很小:"disagreement is small on both axes","分歧主要在{v1}（{a} 分），{v2}较一致（{b} 分）":"the disagreement is mainly in {v1} ({a} pts), while {v2} is fairly consistent ({b} pts)","{txt}，{detail}。{hint}":"{txt}, {detail}. {hint}","不足两套算法给出结果，无法评估模型一致性。":"Fewer than two algorithms returned results, so model agreement cannot be assessed.","可信度较高，可直接据此安排。":"Fairly reliable; you can plan on it.","分歧在可接受范围内，建议结合临近云图复核。":"Disagreement is within an acceptable range; double-check with recent satellite imagery.","请谨慎采信，临近日再确认一次。":"Treat with caution and re-check closer to the date.",天文:"Astronomical",航海:"Nautical",民用:"Civil",晨光始:"dawn",昏影终:"dusk",日出后:"After sunrise",日落后:"After sunset",此刻:"Now","太阳高度角 0° / −6° / −12° / −18°（事件行）":"Solar altitude 0° / −6° / −12° / −18° (event row)",大概率出现:"very likely",值得期待:"worth expecting",可以一试:"worth a try",希望不大:"unlikely",方位角:"Azimuth",持续时间:"Duration",快照模式:"Snapshot mode",生成于:"Generated","打开快照链接不会重新取数，因此不消耗接口额度。":"Opening a snapshot link does not refetch data, so no API quota is used.",一致性:"Consistency","分歧 ΔI":"Divergence ΔI",按当前条件重新计算:"Recalculate with current settings",总样本:"Total samples",本档样本:"Bucket samples",偏差:"Bias",可校准:"Calibrated",标注实况:"Log observation","GFS 统计":"GFS Statistical","EC 统计":"EC Statistical",光追物理:"Ray-traced Physical",光追:"Ray-trace",天文晨光始:"Astronomical dawn",航海晨光始:"Nautical dawn",民用晨光始:"Civil dawn",天文昏影终:"Astronomical dusk",航海昏影终:"Nautical dusk",民用昏影终:"Civil dusk","沉浸式预报体验 —— GFS / ECMWF / 光追物理三套算法，把今晚的天空写成一份可以出发的理由。":"An immersive forecast — GFS, ECMWF and ray-tracing models turn tonight's sky into a reason to head out.","校准仅在本机展示（glowcast.v2.calib），不会回改预报模型。事件结束 1 小时后才可标注；同一地点同一时段只保留一条记录。":"Calibration is shown locally only (glowcast.v2.calib) and never feeds back into the model. Logging opens 1 hour after the event; one record per pl
