ro at 300 km. Faint does not mean weak — it means unknown. That is why the field runs past the viewport edge instead of stopping at a visible boundary.","遮挡层画的是「上游光路被挡」的程度，只在中高值区出现：太阳来向上低云/中云越多，越挡光。默认关闭，要查细节再自己打开。":"The occlusion layer shows how much the upstream light path is blocked, and only where the field is mid-to-high: more low/mid cloud toward the sun means more blocking. Off by default — turn it on to inspect details.",等值线:"Isolines",经纬网:"Graticule","热力图为测试功能，结果仅供参考":"The heatmap is a test feature; for reference only.","热力图测试中 · 结果仅供参考":"Heatmap in testing · for reference only","12 小时制":"12-hour clock",偏好存:"Preferences stored in",朝:"Dawn",晚:"Dusk",条实算结果:"computed rows",重新加载趋势:"Reload Trend",加载趋势:"Load Trend","观赏质量分（右列）":"Quality score (right column)","趋势需要一次性取 34 个坐标 × 10 天数据（约 102 次加权调用），点击「加载趋势」显式触发。":"Trend needs a one-shot fetch of 34 coordinates × 10 days (about 102 weighted calls). Click “Load Trend” to trigger explicitly.",云量类型与覆盖度:"Cloud Cover & Type",云底高度:"Cloud Base Height",光学等效地表高度:"Optical Effective Ground Height",等效云底高度:"Effective Cloud Base",云边界距离:"Cloud Edge Distance",光路上游低层云遮挡:"Upstream Low-Cloud Block","气溶胶光学厚度 AOD":"Aerosol Optical Depth (AOD)",能见度:"Visibility","2m 相对湿度":"2m Relative Humidity",气压稳定性:"Pressure Stability",云边界风速分量:"Cloud-Edge Wind Component",对流活动:"Convection","云量偏少，可能没有足够云体承接霞光。":"Cover is low — there may not be enough cloud to catch the glow.","云量接近全覆盖，阳光难以穿透，易形成闷烧或无霞。":"Cover is near-total; sunlight can hardly penetrate — muted burn or none.","云量处于理想区间，云块之间既能透光又能承接低角度阳光。":"Cover is ideal — gaps let light through while clouds catch low-angle sun.",成立:"valid",不成立:"invalid","本项数据缺失。":"This factor is missing.","13 项判据":"13 criteria",有利:"favourable",中性:"neutral",不利:"unfavourable",数据缺失:"no data",数据不足:"insufficient data",无明显云边界:"no clear cloud edge",模式一致性:"Model agreement","（上限 {v}）":" (max {v})","{type}属{deck}，云底约 {base}。{tail}":"{type} — {deck} cloud, base about {base}. {tail}","云底越高，霞光可出现的范围与色相变化越丰富；云底越低，霞光越局限于橘红且持续时间短。":"The higher the base, the wider the glowing area and the richer the hue range; a low base confines the glow to orange-red and shortens it.","气溶胶把光线“垫高”的等效地表高度，由 AOD 与气溶胶标高 Hs={v} km 计算（z=Hs·ln(AOD/(Hs·k₀))）。该值越大，等效云底越低，霞光越难形成。":"Optical equivalent ground height — how much aerosols lift the light path. Computed from AOD and the aerosol scale height Hs={v} km (z=Hs·ln(AOD/(Hs·k₀))). The larger it is, the lower the effective cloud base and the harder the glow is to form.","云底高度减去光学等效地表高度后的有效高度，是几何判定的真正输入。":"Cloud base minus the optical equivalent ground height; this effective height is the real input to the geometry test.","沿日出/日落方位以 25 km 间隔采样（地图批量估算时以采样网格插值代替实地采样）得到的云盘外缘距离。必须小于霞光深入距离 2√(2Rh)，阳光才能从云底下方照进来；距离越远，颜色越红、开始越晚。":"Distance to the outer edge of the cloud deck, sampled every 25 km along the sunrise/sunset azimuth (the map estimates it by interpolating the sample grid). It must be smaller than the maximum glow reach 2√(2Rh) for sunlight to get in under the cloud base; the farther it is, the redder and later the glow.","低云位于霞光光路下方，是最常见的“翻车”原因：低云量高会把阳光彻底挡住。":"Low cloud sits below the light path and is the most common reason a forecast fails: heavy low cloud blocks the sunlight completely.","气溶胶很少，瑞利散射占主导，阳光颜色纯净、饱和度高，水晶天。":"Very little aerosol, so Rayleigh scattering dominates: clean, saturated colours — a crystal-clear sky.","气溶胶一般，天空通透度普通，颜色饱和度会略降。":"Moderate aerosol; transparency is average and colour saturation drops a little.","气溶胶较多，天空偏霾，会明显削弱霞光的亮度与饱和度。":"Fairly heavy aerosol; the sky is hazy, which clearly cuts the glow's brightness and saturation.","气溶胶大量存在，属“污烧”，低角度霞光细节会被灰霾吞掉。":'Heavy aerosol — a "dirty burn": haze swallows the low-angle detail of the glow.',"反映底层大气通透程度。能见度低于 5 km 时地面附近霾/雾显著，霞光的低角度部分会被遮挡。":"Reflects how clear the lower atmosphere is. Below 5 km, haze or fog near the ground is significant and blocks the low-angle part of the glow.","湿度适中利于云的存在与散射；相对湿度过高（>90%）会形成雾并放大气溶胶消光，反而使天空浑浊；过低则可能没有云。":"Moderate humidity helps clouds exist and scatter light; above 90% it forms fog and amplifies aerosol extinction, muddying the sky, while too low leaves no cloud at all.","气压稳定说明天气系统移动缓慢，云边界位置可预测；气压快速变化意味着云况随时可能改变，预报不确定性大。":"Stable pressure means the weather system is moving slowly and the cloud edge stays predictable; rapid change means the cloud field can shift at any moment, so the forecast is less certain.","云边界沿日出/日落方向的速度分量。经验上 <15 m/s 云边界位置不确定度小，>30 m/s 则很大（云边界会明显推移）。":"The wind component along the sunrise/sunset direction at the cloud edge. Empirically, below 15 m/s the edge position is fairly certain; above 30 m/s it is very uncertain (the edge visibly shifts).","对流强时局地积云/积雨云发展，会随机遮挡光路；但积雨云云砧本身也可能形成漂亮的云砧晚霞。":"Strong convection builds local cumulus or cumulonimbus that can block the path at random — but the anvil itself can also make a spectacular anvil sunset."," · 降水 {v} mm":" · precip {v} mm",两方面分歧都很小:"disagreement is small on both axes","分歧主要在{v1}（{a} 分），{v2}较一致（{b} 分）":"the disagreement is mainly in {v1} ({a} pts), while {v2} is fairly consistent ({b} pts)","{txt}，{detail}。{hint}":"{txt}, {detail}. {hint}","不足两套算法给出结果，无法评估模型一致性。":"Fewer than two algorithms returned results, so model agreement cannot be assessed.","可信度较高，可直接据此安排。":"Fairly reliable; you can plan on it.","分歧在可接受范围内，建议结合临近云图复核。":"Disagreement is within an acceptable range; double-check with recent satellite imagery.","请谨慎采信，临近日再确认一次。":"Treat with caution and re-check closer to the date.",天文:"Astronomical",航海:"Nautical",民用:"Civil",晨光始:"dawn",昏影终:"dusk",日出后:"After sunrise",日落后:"After sunset",此刻:"Now","太阳高度角 0° / −6° / −12° / −18°（事件行）":"Solar altitude 0° / −6° / −12° / −18° (event row)",大概率出现:"very likely",值得期待:"worth expecting",可以一试:"worth a try",希望不大:"unlikely",方位角:"Azimuth",持续时间:"Duration",快照模式:"Snapshot mode",生成于:"Generated","打开快照链接不会重新取数，因此不消耗接口额度。":"Opening a snapshot link does not refetch data, so no API quota is used.",一致性:"Consistency","分歧 ΔI":"Divergence ΔI",按当前条件重新计算:"Recalculate with current settings",总样本:"Total samples",本档样本:"Bucket sam a basis & quota",光追算法细节:"Ray-tracing detail",光追细节:"Ray detail","来自同一份取数结果，不额外请求":"From the same fetch, no extra requests","先计算一次预报，这里才会出现光追推导的中间量。":"Run a forecast first; the intermediate ray-tracing values appear here.","光追模型沿太阳方位逐层追踪光线穿过云层的路径：几何窗口决定「能亮多久」，云量与通透度决定「能亮多好」，三者在综合分里加权。":"The ray model traces sunlight through each cloud deck along the solar azimuth: the geometric window sets how long the glow lasts, cloud cover and transparency set how good it looks, and all three are weighted into the score.","说明 · 概率与质量分怎么算":"Note · How P and Q are computed","概率 P 来自多模型的加权几何平均：GFS、ECMWF 与光追物理各给一份，缺哪一路就自动剔除，其余权重不变。":"P is a weighted geometric mean across GFS, ECMWF and the ray-tracing model; any missing leg is dropped and the remaining weights stay unchanged.","质量分 Q 由云型、云量、云底高度、几何持续与大气通透度共同评分，再换算成等级；它回答「好不好看」，概率回答「有没有」。":"Q combines cloud type, cloud cover, cloud-base height, geometric duration and atmospheric transparency, then maps to a grade: Q answers how good it looks, P answers whether it happens.","可信度看模型分歧 ΔI：分歧越小，综合值越可信；有效模型少于两路时不给分歧值，右上角显示为破折号。":"Confidence follows model divergence ΔI: the smaller the spread, the more reliable the composite. With fewer than two valid models no divergence is given and the field shows a dash.","说明 · 趋势为什么要手动加载":"Note · Why the trend needs a manual load","趋势一次要取 34 个样带点（朝、晚各 17 点）× 10 天，约 102 次加权调用（34 坐标 × 3 路），额度消耗明显高于单点预报。":"The trend fetches 34 transect points (17 for dawn, 17 for dusk) across 10 days — about 102 weighted calls (34 coords × 3 routes), well above a single-point forecast.","所以它不随页面自动触发，需要点「加载趋势」；结果同样缓存 6 小时，重复查看不会再取数。":"So it never runs automatically: press Load trend. Results are cached for 6 hours, so repeat views cost nothing.","每行左侧是出现概率，右侧小字是观赏质量分，朝霞与晚霞分开算，互不参与对方的综合。":"Each row shows probability on the left and quality score in small type on the right; dawn and dusk are computed separately.","气象要素来自 Open-Meteo 的数值预报与空气质量接口，非商业用途；地图底图请求经代理转发，不携带任何个人标识。":"Weather fields come from Open-Meteo forecast and air-quality APIs (non-commercial use); basemap requests are relayed through a proxy carrying no personal identifiers.","结果按「日期 + 时段 + 坐标」分键缓存 6 小时。同一条件重复查看不会重新取数，换地点或换日期才会。":"Results are cached for 6 hours keyed by date + period + coordinates. Repeat views fetch nothing; only a new place or date does.","带 snap 参数的链接是结果快照：打开它不会重新计算，也不消耗接口额度，因此可以和别人分享同一份结论。":"A link with a snap parameter is a result snapshot: opening it neither recomputes nor spends quota, so it can be shared as-is.","实况校准只记录你「看到了 / 没看到」的判断，用于你自己回看准确度，不会反过来改动预报值；样本不足时不给结论。":"Field calibration only records whether you saw the glow, so you can review accuracy later. It never changes the forecast, and with too few samples it draws no conclusion.","免费层每日 10,000 次加权调用（按出口 IP 计，不是按账号）。单点预报约 51 次、一张地图约 171 次、十日趋势约 102 次；地图与趋势都要手动点按钮触发，页面不会自动请求。":"Free tier allows 10,000 weighted calls per day, counted per exit IP rather than per account. A single-point forecast costs about 51 calls, one map about 171, and the 10-day trend about 102. Map and trend both require an explicit button press; the page never requests them on its own.","预报存在不确定性，观赏前请结合当地天气实况判断；本页结论仅供参考，不构成出行建议。":"Forecasts carry uncertainty. Check local conditions before heading out; these conclusions are for reference only.","极亮（可能过曝、色泽偏白）":"Very bright (may overexpose, washed out)","明亮（最佳区间）":"Bright (sweet spot)","明亮偏弱（仍清晰可见）":"Slightly dim (still clearly visible)","较暗（闷烧）":"Dim (smouldering)","很暗（观赏价值低）":"Very dim (low value)","极暗（基本看不到）":"Almost invisible",完全不可见:"Not visible at all","层云/雾":"Stratus / fog",层积云:"Stratocumulus",积云:"Cumulus",高积云:"Altocumulus",高层云:"Altostratus",卷层云:"Cirrostratus",卷云:"Cirrus",朝霞方位:"Sunrise azimuth",晚霞方位:"Sunset azimuth",北:"N",东北:"NE",东:"E",东南:"SE",南:"S",西南:"SW",西:"W",西北:"NW",几何条件:"Geometry",火烧云三角几何条件成立:"the fire-cloud triangle geometry holds","几何条件不成立：云边界距离 {d} 已超过霞光深入距离上限 {m}（该云盘范围内阳光无法从云底下方射入）":"Geometry does not hold: the cloud edge at {d} exceeds the maximum glow reach of {m} (within that cloud deck sunlight cannot ge
