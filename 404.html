<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<!-- 站点根推导：404 页会被托管平台套在**任意错误路径**下返回，纯相对地址在那里
     会按错链解析（越深越错）。这里先按部署形态推出站点根并注入 <base>，让本页
     后续所有相对地址（图标 / 背景照片 / 导航 / 按钮）自动落到正确位置。
     本地 file:// 双击不注入：相对地址本来就在同目录。 -->
<script>
(function () {
  if (location.protocol === "file:") return;
  var base = "/";
  /* GitHub Pages 项目页的站点根是 /仓库名/；仓库改名或被 fork 后仓库名会变，
     所以取实际路径的第一段，而不是写死仓库名。自定义域名部署时域名不是
     *.github.io，站点根就是 /。 */
  if (/\.github\.io$/i.test(location.hostname || "")) {
    var seg = location.pathname.split("/")[1] || "";
    if (seg) base = "/" + seg + "/";
  }
  var el = document.createElement("base");
  el.href = base;
  document.head.insertBefore(el, document.currentScript);
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>页面不存在 · SUNGLOW Spectrum Edition · 光谱观测版</title>

<link rel="icon" type="image/png" href="./favicon-192.png">
<script>
/* 首帧前定主题与语言：从主页同一个偏好键读，避免刷新闪白/闪中文 */
(function () {
  var pref = {};
  try { pref = JSON.parse(localStorage.getItem("SUNGLOW.v2.pref") || "{}") || {}; } catch (e) { pref = {}; }
  var theme = pref.theme === "dark" || pref.theme === "light" ? pref.theme : "auto";
  var dark = theme === "dark" || (theme === "auto" && !(window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches));
  document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  document.documentElement.style.colorScheme = dark ? "dark" : "light";
  var lang = pref.lang === "hant" || pref.lang === "en" ? pref.lang : "zh";
  /* ?lang= 优先于偏好：与教程页同一口径，分享 / 跨域互跳时可直接指定语言 */
  try {
    var ql = new URLSearchParams(location.search).get("lang");
    if (ql === "zh" || ql === "hant" || ql === "en") lang = ql;
  } catch (e) { /* 老内核不支持 URLSearchParams 时退回偏好 */ }
  document.documentElement.setAttribute("lang", lang === "zh" ? "zh-CN" : lang === "hant" ? "zh-Hant-TW" : "en");
  window.__gcPref = { lang: lang, theme: theme };
})();
</script>

.brand-name{
  display:flex; flex-wrap:wrap; align-items:baseline; column-gap:7px;
  font-size:1.02rem; line-height:1.25;
}
.brand-name em{
  font-style:normal; font-size:.72rem; letter-spacing:.16em;
  color:var(--tx-3); font-weight:500;
}
.actions{display:flex; align-items:center; gap:8px; margin-left:auto}
.icon-btn{
  width:34px; height:34px; display:inline-flex; align-items:center; justify-content:center;
  border-radius:8px; border:1px solid transparent;
  color:var(--tx-2); font-size:.85rem; font-weight:600; line-height:1;
  transition:color .16s ease, border-color .16s ease, background .16s ease;
}
.icon-btn:hover{color:var(--tx-1); border-color:var(--stroke-2); background:var(--bg-glass)}
.pop-holder{position:relative}
.menu{
  position:absolute; right:0; top:calc(100% + 6px); min-width:168px; padding:6px;
  border-radius:14px; border:1px solid var(--stroke-2);
  background:var(--bg-card-solid); box-shadow:var(--card-sh); z-index:300;
}
.menu[hidden]{display:none}
.menu button{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  width:100%; padding:8px 12px; border-radius:8px;
  font-size:.82rem; color:var(--tx-2); text-align:left;
}
.menu button:hover{background:var(--bg-glass-2); color:var(--tx-1)}
.menu button[aria-pressed="true"]{color:var(--tx-1); background:var(--bg-glass-2)}
.menu .tick{font-size:11px; visibility:hidden}
.menu button[aria-pressed="true"] .tick{visibility:visible}
@media (max-width:720px){
  .topbar-in{height:56px}
}

/* ---------- 主体 ---------- */
main{
  max-width:720px; margin:0 auto; padding:clamp(28px,7vh,72px) 20px 64px;
}
.card{
  position:relative; overflow:hidden;
  border-radius:var(--r-md); border:1px solid var(--stroke);
  background:var(--bg-card); box-shadow:var(--card-sh);
  padding:clamp(24px,4vw,40px);
}
.card::before{
  content:""; position:absolute; inset:0 0 auto 0; height:2px; background:var(--spectrum); opacity:.85;
}
.code{
  font-size:clamp(64px,14vw,116px); line-height:.92; font-weight:700; letter-spacing:-.05em;
  background:var(--spectrum); -webkit-background-clip:text; background-clip:text; color:transparent;
  margin:0 0 6px;
}
h1{font-size:clamp(19px,2.6vw,24px); margin:0 0 10px; letter-spacing:-.01em}
.lead{color:var(--tx-2); line-height:1.8; margin:0 0 18px; font-size:15px}
.slogan{color:var(--tx-3); font-size:12.5px; letter-spacing:.04em; margin:0 0 18px}
.miss{
  display:flex; gap:10px; align-items:baseline; flex-wrap:wrap;
  padding:10px 12px; border-radius:var(--r-sm);
  background:var(--bg-glass); border:1px solid var(--stroke);
  font-size:12.5px; color:var(--tx-3); margin-bottom:22px;
}
.miss code{color:var(--tx-2); word-break:break-all; font-size:12.5px}
.miss[hidden]{display:none}
.btn-row{display:flex; gap:10px; flex-wrap:wrap}
.btn{
  padding:10px 18px; border-radius:var(--r-full); font-size:14px;
  border:1px solid var(--stroke-2); color:var(--tx-1); background:var(--bg-glass);
  transition:transform .12s ease, border-color .12s ease;
}
.btn:hover{transform:translateY(-1px)}
.btn.primary{border:0; background:var(--spectrum); color:var(--tx-inv); font-weight:600}
.btn[hidden]{display:none}
.foot{
  margin:26px 0 0; font-size:12.5px; color:var(--tx-3); line-height:1.9;
}
.foot a{color:var(--tx-2); border-bottom:1px dotted var(--stroke-2)}
/* ---- 实拍铺底（广州 · 珠江）：整页照片 + 玻璃卡浮在上面 ---- */
html{background:var(--bg-base)}
body{background:transparent}
:root,html[data-theme="dark"]{
  --ph-veil:
    radial-gradient(760px 520px at 26% 40%, rgba(7,11,20,.62), rgba(7,11,20,.16) 62%, transparent 84%),
    linear-gradient(180deg, rgba(7,11,20,.30) 0%, rgba(7,11,20,.06) 40%, rgba(7,11,20,.45) 74%, transparent 100%);
  --ph-credit:rgba(233,238,251,.62);
  --ph-card:rgba(13,20,35,.80);
  --ph-bar:rgba(7,11,20,.42);
}
html[data-theme="light"]{
  --ph-veil:
    radial-gradient(760px 520px at 26% 40%, rgba(255,255,255,.80), rgba(255,255,255,.42) 62%, transparent 84%),
    linear-gradient(180deg, rgba(242,245,251,.55) 0%, rgba(242,245,251,.18) 40%, rgba(242,245,251,.45) 74%, transparent 100%);
  --ph-credit:rgba(17,26,44,.56);
  --ph-card:rgba(255,255,255,.88);
  --ph-bar:rgba(255,255,255,.55);
}
.ph-bg{position:fixed; inset:0; z-index:-1; background:url("./hero-photo.webp") 50% 30%/cover no-repeat}
.ph-bg::after{content:""; position:absolute; inset:0; background:var(--ph-veil)}
/* 浅色：右下角是深色水面，署名是深色字，需要把底边提亮一点才读得清 */
html[data-theme="light"] .ph-bg::after{
  background:var(--ph-veil), linear-gradient(180deg, transparent 78%, rgba(242,245,251,.55) 100%);
}
.ph-credit{
  position:fixed; right:18px; bottom:14px; z-index:2;
  font-size:11px; letter-spacing:.06em; color:var(--ph-credit);
  text-shadow:0 1px 12px rgba(2,6,16,.90);
}
html[data-theme="light"] .ph-credit{text-shadow:0 1px 10px rgba(242,245,251,.90)}
.card{
  background:var(--ph-card);
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
}
.topbar{background:var(--ph-bar)}
</style>
</head>
<body>

<div class="ph-bg" aria-hidden="true"></div>
<span class="ph-credit" data-i18n="广州 · 珠江 · 实拍">广州 · 珠江 · 实拍</span>

<header class="topbar">
  <div class="topbar-in">
    <a class="brand" id="brand" href="./index.html">
      <span class="brand-logo"></span>
      <span class="brand-name"><b data-i18n="霞光档案">霞光档案</b><em>SUNGLOW</em></span>
    </a>

    <div class="actions">
      <div class="pop-holder">
        <button class="icon-btn" id="langBtn" aria-haspopup="true" aria-expanded="false" aria-label="语言">简</button>
        <div class="menu" id="langMenu" hidden role="menu">
          <button role="menuitemradio" data-lang="zh"><span>简体中文</span><span class="tick">✓</span></button>
          <button role="menuitemradio" data-lang="hant"><span>繁體中文</span><span class="tick">✓</span></button>
          <button role="menuitemradio" data-lang="en"><span>English</span><span class="tick">✓</span></button>
        </div>
      </div>
      <div class="pop-holder">
        <button class="icon-btn" id="themeBtn" aria-haspopup="true" aria-expanded="false" aria-label="主题">◐</button>
        <div class="menu" id="themeMenu" hidden role="menu">
          <button role="menuitemradio" data-theme-mode="dark"><span data-i18n="深色">深色</span><span class="tick">✓</span></button>
          <button role="menuitemradio" data-theme-mode="light"><span data-i18n="浅色">浅色</span><span class="tick">✓</span></button>
          <button role="menuitemradio" data-theme-mode="auto"><span data-i18n="跟随系统">跟随系统</span><span class="tick">✓</span></button>
        </div>
      </div>
    </div>
  </div>
</header>

<main>
  <div class="card">
    <p class="code">404</p>
    <h1 data-i18n="页面不存在">页面不存在</h1>
    <p class="lead" data-i18n="这条地址没有对应的页面——链接可能已经更新，或者路径里有拼写错误。">这条地址没有对应的页面——链接可能已经更新，或者路径里有拼写错误。</p>
    <p class="slogan" data-i18n="让每一次追霞，都有迹可循">让每一次追霞，都有迹可循</p>

    <div class="miss" id="miss" hidden>
      <span data-i18n="请求地址">请求地址</span>
      <code id="missTx"></code>
    </div>

    <div class="btn-row">
      <a class="btn primary" id="btnHome" href="./index.html" data-i18n="返回首页">返回首页</a>
      <button class="btn" id="btnBack" hidden data-i18n="返回上一页">返回上一页</button>
    </div>

    <p class="foot">
      <span data-i18n="霞光档案 · SUNGLOW Spectrum Edition 是单文件应用：整个程序就是一个 index.html，双击即可打开；气象取数需要联网。">霞光档案 · SUNGLOW Spectrum Edition 是单文件应用：整个程序就是一个 index.html，双击即可打开；气象取数需要联网。</span>
      <a href="./index.html" data-i18n="打开应用">打开应用</a>
    </p>
  </div>
</main>

<script>
(function () {
  "use strict";

  /* ---------------- 三语词条（与主页同一套措辞） ---------------- */
  var DICT = {
    hant: {
      "霞光档案": "霞光檔案",
      "让每一次追霞，都有迹可循": "讓每一次追霞，都有跡可循",
      "结论": "結論",
      "十日趋势": "十日趨勢",
      "观测场": "觀測場",
      "使用教程": "使用教學",
      "页面不存在": "頁面不存在",
      "这条地址没有对应的页面——链接可能已经更新，或者路径里有拼写错误。":
        "這條位址沒有對應的頁面——連結可能已經更新，或者路徑裡有拼寫錯誤。",
      "请求地址": "請求位址",
      "返回首页": "返回首頁",
      "返回上一页": "返回上一頁",
      "深色": "深色",
      "浅色": "淺色",
      "跟随系统": "跟隨系統",
      "霞光档案 · SUNGLOW Spectrum Edition 是单文件应用：整个程序就是一个 index.html，双击即可打开；气象取数需要联网。":
        "霞光檔案 · SUNGLOW Spectrum Edition 是單檔應用：整個程式就是一個 index.html，雙擊即可開啟；氣象取數需要連網。",
      "打开应用": "開啟應用",
      "页面不存在 · SUNGLOW Spectrum Edition · 光谱观测版": "頁面不存在 · SUNGLOW Spectrum Edition · 光譜觀測版",
      "Spectrum Edition · 光谱观测版": "Spectrum Edition · 光譜觀測版",
      "语言": "語言",
      "主题": "主題",
      "广州 · 珠江 · 实拍": "廣州 · 珠江 · 實拍"
    },
    en: {
      "霞光档案": "霞光档案",
      "让每一次追霞，都有迹可循": "Every glow chase leaves a trace.",
      "结论": "Verdict",
      "十日趋势": "10-Day Trend",
      "观测场": "Observation Field",
      "使用教程": "Guide",
      "页面不存在": "Page not found",
      "这条地址没有对应的页面——链接可能已经更新，或者路径里有拼写错误。":
        "This address has no matching page — the link may have changed, or the path has a typo.",
      "请求地址": "Requested URL",
      "返回首页": "Back to home",
      "返回上一页": "Go back",
      "深色": "Dark",
      "浅色": "Light",
      "跟随系统": "System",
      "霞光档案 · SUNGLOW Spectrum Edition 是单文件应用：整个程序就是一个 index.html，双击即可打开；气象取数需要联网。":
        "SUNGLOW Spectrum Edition ships as a single file: the whole app is one index.html you can open directly; fetching weather data requires a network connection.",
      "打开应用": "Open the app",
      "页面不存在 · SUNGLOW Spectrum Edition · 光谱观测版": "Page not found · SUNGLOW Spectrum Edition",
      "Spectrum Edition · 光谱观测版": "Spectrum Edition",
      "语言": "Language",
      "主题": "Theme",
      "广州 · 珠江 · 实拍": "Guangzhou · Pearl River · Photo"
    }
  };

  var pref = window.__gcPref || { lang: "zh", theme: "auto" };
  var lang = pref.lang;
  var themeMode = pref.theme;         /* dark | light | auto */
  var LANG_SHORT = { zh: "简", hant: "繁", en: "EN" };

  /* ---------------- 偏好读写：只改 lang/theme，其它字段原样保留 ---------------- */
  function readPref() {
    try { return JSON.parse(localStorage.getItem("SUNGLOW.v2.pref") || "{}") || {}; } catch (e) { return {}; }
  }
  function writePref(patch) {
    var p = readPref();
    for (var k in patch) if (Object.prototype.hasOwnProperty.call(patch, k)) p[k] = patch[k];
    try { localStorage.setItem("SUNGLOW.v2.pref", JSON.stringify(p)); } catch (e) { /* 隐私模式 */ }
  }

  /* ---------------- 语言 ---------------- */
  function t(key) {
    if (lang === "zh") return key;
    var d = DICT[lang];
    return (d && d[key]) || key;
  }
  function applyLang() {
    document.documentElement.setAttribute("lang",
      lang === "zh" ? "zh-CN" : lang === "hant" ? "zh-Hant-TW" : "en");
    var nodes = document.querySelectorAll("[data-i18n]");
    for (var i = 0; i < nodes.length; i++) {
      nodes[i].textContent = t(nodes[i].getAttribute("data-i18n"));
    }
    document.title = t("页面不存在 · SUNGLOW Spectrum Edition · 光谱观测版");
    var lb = document.getElementById("langBtn");
    if (lb) { lb.textContent = LANG_SHORT[lang]; lb.setAttribute("aria-label", t("语言")); }
    var tb = document.getElementById("themeBtn");
    if (tb) tb.setAttribute("aria-label", t("主题"));
    syncMenus();
  }

  /* ---------------- 主题 ---------------- */
  function systemDark() {
    return !(window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches);
  }
  function applyTheme() {
    var dark = themeMode === "dark" || (themeMode === "auto" && systemDark());
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
    document.documentElement.style.colorScheme = dark ? "dark" : "light";
    var tb = document.getElementById("themeBtn");
    if (tb) tb.textContent = themeMode === "dark" ? "☾" : themeMode === "light" ? "☀" : "◐";
    syncMenus();
  }
  if (window.matchMedia) {
    try {
      matchMedia("(prefers-color-scheme: light)").addEventListener("change", function () {
        if (themeMode === "auto") applyTheme();
      });
    } catch (e) { /* 老浏览器 */ }
  }

  /* ---------------- 菜单 ---------------- */
  function syncMenus() {
    var lm = document.getElementById("langMenu");
    var tm = document.getElementById("themeMenu");
    if (lm) {
      var ls = lm.querySelectorAll("[data-lang]");
      for (var i = 0; i < ls.length; i++) {
        ls[i].setAttribute("aria-pressed", ls[i].getAttribute("data-lang") === lang ? "true" : "false");
      }
    }
    if (tm) {
      var ts = tm.querySelectorAll("[data-theme-mode]");
      for (var j = 0; j < ts.length; j++) {
        ts[j].setAttribute("aria-pressed", ts[j].getAttribute("data-theme-mode") === themeMode ? "true" : "false");
      }
    }
  }
  function closeMenus() {
    ["langMenu", "themeMenu"].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.hidden = true;
    });
    ["langBtn", "themeBtn"].forEach(function (id) {
      var b = document.getElementById(id);
      if (b) b.setAttribute("aria-expanded", "false");
    });
  }
  function toggleMenu(btnId, menuId) {
    var btn = document.getElementById(btnId), menu = document.getElementById(menuId);
    if (!btn || !menu) return;
    var willOpen = menu.hidden;
    closeMenus();
    if (willOpen) {
      menu.hidden = false;
      btn.setAttribute("aria-expanded", "true");
    }
  }

  /* ---------------- 绑定 ---------------------------- */
  /* 本页所有站内地址都写相对形式：http(s) 下由页面顶部注入的 <base> 统一落到
     站点根（GitHub Pages 项目页也能用，且不依赖仓库名）；file:// 双击时没有
     <base>，相对地址本来就在同目录。 */
  var home = "index.html" + (location.hash || "");
  var btnHome = document.getElementById("btnHome");
  if (btnHome) btnHome.setAttribute("href", home);
  var brand = document.getElementById("brand");
  if (brand) brand.setAttribute("href", home);

  /* 请求地址只走 textContent（路径是用户可控输入） */
  var path = location.pathname + (location.search || "");
  var miss = document.getElementById("miss");
  var missTx = document.getElementById("missTx");
  if (miss && missTx && path) { missTx.textContent = path; miss.hidden = false; }

  /* 返回上一页：history.length 是唯一可靠信号 */
  var back = document.getElementById("btnBack");
  if (back && history.length > 1) {
    back.hidden = false;
    back.addEventListener("click", function () { history.back(); });
  }

  document.getElementById("langBtn").addEventListener("click", function (e) {
    e.stopPropagation(); toggleMenu("langBtn", "langMenu");
  });
  document.getElementById("themeBtn").addEventListener("click", function (e) {
    e.stopPropagation(); toggleMenu("themeBtn", "themeMenu");
  });

  var lm = document.getElementById("langMenu");
  lm.addEventListener("click", function (e) {
    var b = e.target.closest("[data-lang]");
    if (!b) return;
    lang = b.getAttribute("data-lang");
    writePref({ lang: lang });
    applyLang(); closeMenus();
  });

  var tm = document.getElementById("themeMenu");
  tm.addEventListener("click", function (e) {
    var b = e.target.closest("[data-theme-mode]");
    if (!b) return;
    themeMode = b.getAttribute("data-theme-mode");
    writePref({ theme: themeMode });
    applyTheme(); closeMenus();
  });

  document.addEventListener("click", function (e) {
    if (!e.target.closest(".pop-holder")) closeMenus();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closeMenus();
  });

  applyLang();
  applyTheme();
})();
</script>
</body>
</html>
