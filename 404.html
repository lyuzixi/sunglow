<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>页面不存在 · 霞光档案 · SUNGLOW</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#070b14">
<link rel="icon" type="image/png" href="./favicon-192.png">
<script>
/* 首帧前定主题与语言：从主页同一个偏好键读，避免刷新闪白/闪中文 */
(function () {
  var pref = {};
  try { pref = JSON.parse(localStorage.getItem("glowcast.v2.pref") || "{}") || {}; } catch (e) { pref = {}; }
  var theme = pref.theme === "dark" || pref.theme === "light" ? pref.theme : "auto";
  var dark = theme === "dark" || (theme === "auto" && !(window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches));
  document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  document.documentElement.style.colorScheme = dark ? "dark" : "light";
  var lang = pref.lang === "hant" || pref.lang === "en" ? pref.lang : "zh";
  document.documentElement.setAttribute("lang", lang === "zh" ? "zh-CN" : lang === "hant" ? "zh-Hant" : "en");
  window.__gcPref = { lang: lang, theme: theme };
})();
</script>
<style>
:root{
  --spectrum-1:#ff4d82; --spectrum-2:#ff9c3f; --spectrum-3:#2ed5e8;
  --spectrum:linear-gradient(90deg,var(--spectrum-1),var(--spectrum-2),var(--spectrum-3));
  --r-sm:10px; --r-md:16px; --r-full:999px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
}
html[data-theme="dark"]{
  --bg-base:#070b14; --bg-card:rgba(15,23,42,.62); --bg-glass:rgba(130,160,220,.06);
  --bg-glass-2:rgba(130,160,220,.10); --stroke:rgba(148,178,232,.14); --stroke-2:rgba(148,178,232,.26);
  --tx-1:#e9eefb; --tx-2:#a0b1cd; --tx-3:#5c6c8c; --tx-inv:#06101c;
  --card-sh:0 18px 48px rgba(2,6,16,.55);
  --glow:radial-gradient(60% 50% at 50% 0%, rgba(255,156,63,.16), transparent 70%);
}
html[data-theme="light"]{
  --bg-base:#f2f5fb; --bg-card:rgba(255,255,255,.72); --bg-glass:rgba(255,255,255,.55);
  --bg-glass-2:rgba(255,255,255,.78); --stroke:rgba(40,60,100,.10); --stroke-2:rgba(40,60,100,.20);
  --tx-1:#111a2c; --tx-2:#46556f; --tx-3:#8693ab; --tx-inv:#ffffff;
  --card-sh:0 12px 32px rgba(20,40,80,.10);
  --glow:radial-gradient(60% 50% at 50% 0%, rgba(255,156,63,.20), transparent 70%);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  min-height:100vh; background:var(--bg-base); color:var(--tx-1);
  font-family:var(--font); -webkit-font-smoothing:antialiased;
  background-image:var(--glow); background-repeat:no-repeat; background-size:100% 60vh;
}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ---------- 头栏（与主页 TopBar 同构） ---------- */
.topbar{
  position:sticky; top:0; z-index:50;
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  background:var(--bg-card);
  border-bottom:1px solid var(--stroke);
}
.topbar-in{
  max-width:1120px; margin:0 auto; padding:10px 20px;
  display:flex; align-items:center; gap:18px;
}
.brand{display:flex; align-items:center; gap:10px; min-width:0}
.brand-dot{
  width:26px; height:26px; border-radius:50%; flex:0 0 auto;
  background:url("./icon-192.png") center/cover no-repeat;
}
.brand-tx{display:flex; align-items:baseline; gap:6px; white-space:nowrap; overflow:hidden}
.brand-tx b{font-size:15px; letter-spacing:-.01em}
.brand-tx em{font-style:normal; font-size:10.5px; letter-spacing:.16em; color:var(--tx-3)}
.nav{display:flex; align-items:center; gap:2px; margin-left:6px; flex:1 1 auto; min-width:0}
.nav a{
  padding:7px 11px; border-radius:var(--r-full); font-size:13px; color:var(--tx-2);
  white-space:nowrap;
}
.nav a:hover{background:var(--bg-glass-2); color:var(--tx-1)}
.actions{display:flex; align-items:center; gap:8px; margin-left:auto}
.icon-btn{
  width:34px; height:34px; border-radius:50%; display:grid; place-items:center;
  border:1px solid var(--stroke); background:var(--bg-glass); color:var(--tx-2);
  font-size:13px; line-height:1;
}
.icon-btn:hover{border-color:var(--stroke-2); color:var(--tx-1)}
.pop-holder{position:relative}
.menu{
  position:absolute; right:0; top:calc(100% + 8px); min-width:132px; padding:6px;
  border-radius:var(--r-md); border:1px solid var(--stroke-2);
  background:var(--bg-card); box-shadow:var(--card-sh); z-index:60;
}
.menu[hidden]{display:none}
.menu button{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  width:100%; padding:8px 10px; border-radius:var(--r-sm); font-size:13px; color:var(--tx-2);
  text-align:left;
}
.menu button:hover{background:var(--bg-glass-2); color:var(--tx-1)}
.menu button[aria-pressed="true"]{color:var(--tx-1); font-weight:600}
.menu .tick{font-size:11px; color:var(--spectrum-2); visibility:hidden}
.menu button[aria-pressed="true"] .tick{visibility:visible}

/* ---------- 主体 ---------- */
main{
  max-width:720px; margin:0 auto; padding:clamp(28px,7vh,72px) 20px 64px;
}
.card{
  position:relative; overflow:hidden;
  border-radius:var(--r-md); border:1px solid var(--stroke);
  background:var(--bg-card); box-shadow:var(--card-sh);
  padding:clamp(24px,4vw,40px);
}
.card::before{
  content:""; position:absolute; inset:0 0 auto 0; height:2px; background:var(--spectrum); opacity:.85;
}
.code{
  font-size:clamp(64px,14vw,116px); line-height:.92; font-weight:700; letter-spacing:-.05em;
  background:var(--spectrum); -webkit-background-clip:text; background-clip:text; color:transparent;
  margin:0 0 6px;
}
h1{font-size:clamp(19px,2.6vw,24px); margin:0 0 10px; letter-spacing:-.01em}
.lead{color:var(--tx-2); line-height:1.8; margin:0 0 18px; font-size:15px}
.slogan{color:var(--tx-3); font-size:12.5px; letter-spacing:.04em; margin:0 0 18px}
.miss{
  display:flex; gap:10px; align-items:baseline; flex-wrap:wrap;
  padding:10px 12px; border-radius:var(--r-sm);
  background:var(--bg-glass); border:1px solid var(--stroke);
  font-size:12.5px; color:var(--tx-3); margin-bottom:22px;
}
.miss code{color:var(--tx-2); word-break:break-all; font-size:12.5px}
.miss[hidden]{display:none}
.btn-row{display:flex; gap:10px; flex-wrap:wrap}
.btn{
  padding:10px 18px; border-radius:var(--r-full); font-size:14px;
  border:1px solid var(--stroke-2); color:var(--tx-1); background:var(--bg-glass);
  transition:transform .12s ease, border-color .12s ease;
}
.btn:hover{transform:translateY(-1px)}
.btn.primary{border:0; background:var(--spectrum); color:var(--tx-inv); font-weight:600}
.btn[hidden]{display:none}
.foot{
  margin:26px 0 0; font-size:12.5px; color:var(--tx-3); line-height:1.9;
}
.foot a{color:var(--tx-2); border-bottom:1px dotted var(--stroke-2)}
@media (max-width:760px){
  .nav{display:none}
  .brand-tx em{display:none}
  .topbar-in{padding:8px 14px; gap:12px}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <a class="brand" id="brand" href="./index.html">
      <span class="brand-dot"></span>
      <span class="brand-tx"><b data-i18n="霞光档案">霞光档案</b><em>SUNGLOW</em></span>
    </a>

    <nav class="nav" id="nav">
      <a href="./index.html" data-i18n="结论">结论</a>
      <a href="./index.html#trend" data-i18n="十日趋势">十日趋势</a>
      <a href="./index.html#field" data-i18n="观测场">观测场</a>
      <a href="./tutorial.html" data-i18n="使用教程">使用教程</a>
    </nav>

    <div class="actions">
      <div class="pop-holder">
        <button class="icon-btn" id="langBtn" aria-haspopup="true" aria-expanded="false" aria-label="语言">简</button>
        <div class="menu" id="langMenu" hidden role="menu">
          <button role="menuitemradio" data-lang="zh"><span>简体中文</span><span class="tick">✓</span></button>
          <button role="menuitemradio" data-lang="hant"><span>繁體中文</span><span class="tick">✓</span></button>
          <button role="menuitemradio" data-lang="en"><span>English</span><span class="tick">✓</span></button>
        </div>
      </div>
      <div class="pop-holder">
        <button class="icon-btn" id="themeBtn" aria-haspopup="true" aria-expanded="false" aria-label="主题">◐</button>
        <div class="menu" id="themeMenu" hidden role="menu">
          <button role="menuitemradio" data-theme-mode="dark"><span data-i18n="深色">深色</span><span class="tick">✓</span></button>
          <button role="menuitemradio" data-theme-mode="light"><span data-i18n="浅色">浅色</span><span class="tick">✓</span></button>
          <button role="menuitemradio" data-theme-mode="auto"><span data-i18n="跟随系统">跟随系统</span><span class="tick">✓</span></button>
        </div>
      </div>
    </div>
  </div>
</header>

<main>
  <div class="card">
    <p class="code">404</p>
    <h1 data-i18n="页面不存在">页面不存在</h1>
    <p class="lead" data-i18n="这条地址没有对应的页面——链接可能已经更新，或者路径里有拼写错误。">这条地址没有对应的页面——链接可能已经更新，或者路径里有拼写错误。</p>
    <p class="slogan" data-i18n="让每一次追霞，都有迹可循">让每一次追霞，都有迹可循</p>

    <div class="miss" id="miss" hidden>
      <span data-i18n="请求地址">请求地址</span>
      <code id="missTx"></code>
    </div>

    <div class="btn-row">
      <a class="btn primary" id="btnHome" href="./index.html" data-i18n="返回首页">返回首页</a>
      <button class="btn" id="btnBack" hidden data-i18n="返回上一页">返回上一页</button>
    </div>

    <p class="foot">
      <span data-i18n="霞光档案 v2 是单文件应用：整个程序就是一个 index.html，双击即可离线使用。">霞光档案 v2 是单文件应用：整个程序就是一个 index.html，双击即可离线使用。</span>
      <a href="./index.html" data-i18n="打开应用">打开应用</a>
    </p>
  </div>
</main>

<script>
(function () {
  "use strict";

  /* ---------------- 三语词条（与主页同一套措辞） ---------------- */
  var DICT = {
    hant: {
      "霞光档案": "霞光檔案",
      "让每一次追霞，都有迹可循": "讓每一次追霞，都有跡可循",
      "结论": "結論",
      "十日趋势": "十日趨勢",
      "观测场": "觀測場",
      "使用教程": "使用教學",
      "页面不存在": "頁面不存在",
      "这条地址没有对应的页面——链接可能已经更新，或者路径里有拼写错误。":
        "這條位址沒有對應的頁面——連結可能已經更新，或者路徑裡有拼寫錯誤。",
      "请求地址": "請求位址",
      "返回首页": "返回首頁",
      "返回上一页": "返回上一頁",
      "深色": "深色",
      "浅色": "淺色",
      "跟随系统": "跟隨系統",
      "霞光档案 v2 是单文件应用：整个程序就是一个 index.html，双击即可离线使用。":
        "霞光檔案 v2 是單檔應用：整個程式就是一個 index.html，雙擊即可離線使用。",
      "打开应用": "開啟應用",
      "页面不存在 · 霞光档案 · SUNGLOW": "頁面不存在 · 霞光檔案 · SUNGLOW",
      "语言": "語言",
      "主题": "主題"
    },
    en: {
      "霞光档案": "霞光档案",
      "让每一次追霞，都有迹可循": "Every glow chase leaves a trace.",
      "结论": "Verdict",
      "十日趋势": "10-Day Trend",
      "观测场": "Observation Field",
      "使用教程": "Guide",
      "页面不存在": "Page not found",
      "这条地址没有对应的页面——链接可能已经更新，或者路径里有拼写错误。":
        "This address has no matching page — the link may have changed, or the path has a typo.",
      "请求地址": "Requested URL",
      "返回首页": "Back to home",
      "返回上一页": "Go back",
      "深色": "Dark",
      "浅色": "Light",
      "跟随系统": "System",
      "霞光档案 v2 是单文件应用：整个程序就是一个 index.html，双击即可离线使用。":
        "SUNGLOW v2 ships as a single file: the whole app is one index.html you can open offline.",
      "打开应用": "Open the app",
      "页面不存在 · 霞光档案 · SUNGLOW": "Page not found · SUNGLOW",
      "语言": "Language",
      "主题": "Theme"
    }
  };

  var pref = window.__gcPref || { lang: "zh", theme: "auto" };
  var lang = pref.lang;
  var themeMode = pref.theme;         /* dark | light | auto */
  var LANG_SHORT = { zh: "简", hant: "繁", en: "EN" };

  /* ---------------- 偏好读写：只改 lang/theme，其它字段原样保留 ---------------- */
  function readPref() {
    try { return JSON.parse(localStorage.getItem("glowcast.v2.pref") || "{}") || {}; } catch (e) { return {}; }
  }
  function writePref(patch) {
    var p = readPref();
    for (var k in patch) if (Object.prototype.hasOwnProperty.call(patch, k)) p[k] = patch[k];
    try { localStorage.setItem("glowcast.v2.pref", JSON.stringify(p)); } catch (e) { /* 隐私模式 */ }
  }

  /* ---------------- 语言 ---------------- */
  function t(key) {
    if (lang === "zh") return key;
    var d = DICT[lang];
    return (d && d[key]) || key;
  }
  function applyLang() {
    document.documentElement.setAttribute("lang",
      lang === "zh" ? "zh-CN" : lang === "hant" ? "zh-Hant" : "en");
    var nodes = document.querySelectorAll("[data-i18n]");
    for (var i = 0; i < nodes.length; i++) {
      nodes[i].textContent = t(nodes[i].getAttribute("data-i18n"));
    }
    document.title = t("页面不存在 · 霞光档案 · SUNGLOW");
    var lb = document.getElementById("langBtn");
    if (lb) { lb.textContent = LANG_SHORT[lang]; lb.setAttribute("aria-label", t("语言")); }
    var tb = document.getElementById("themeBtn");
    if (tb) tb.setAttribute("aria-label", t("主题"));
    syncMenus();
  }

  /* ---------------- 主题 ---------------- */
  function systemDark() {
    return !(window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches);
  }
  function applyTheme() {
    var dark = themeMode === "dark" || (themeMode === "auto" && systemDark());
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
    document.documentElement.style.colorScheme = dark ? "dark" : "light";
    var tb = document.getElementById("themeBtn");
    if (tb) tb.textContent = themeMode === "dark" ? "☾" : themeMode === "light" ? "☀" : "◐";
    syncMenus();
  }
  if (window.matchMedia) {
    try {
      matchMedia("(prefers-color-scheme: light)").addEventListener("change", function () {
        if (themeMode === "auto") applyTheme();
      });
    } catch (e) { /* 老浏览器 */ }
  }

  /* ---------------- 菜单 ---------------- */
  function syncMenus() {
    var lm = document.getElementById("langMenu");
    var tm = document.getElementById("themeMenu");
    if (lm) {
      var ls = lm.querySelectorAll("[data-lang]");
      for (var i = 0; i < ls.length; i++) {
        ls[i].setAttribute("aria-pressed", ls[i].getAttribute("data-lang") === lang ? "true" : "false");
      }
    }
    if (tm) {
      var ts = tm.querySelectorAll("[data-theme-mode]");
      for (var j = 0; j < ts.length; j++) {
        ts[j].setAttribute("aria-pressed", ts[j].getAttribute("data-theme-mode") === themeMode ? "true" : "false");
      }
    }
  }
  function closeMenus() {
    ["langMenu", "themeMenu"].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.hidden = true;
    });
    ["langBtn", "themeBtn"].forEach(function (id) {
      var b = document.getElementById(id);
      if (b) b.setAttribute("aria-expanded", "false");
    });
  }
  function toggleMenu(btnId, menuId) {
    var btn = document.getElementById(btnId), menu = document.getElementById(menuId);
    if (!btn || !menu) return;
    var willOpen = menu.hidden;
    closeMenus();
    if (willOpen) {
      menu.hidden = false;
      btn.setAttribute("aria-expanded", "true");
    }
  }

  /* ---------------- 站点入口推导（任意深度兜底） ---------------- */
  function deriveEntry() {
    if (location.protocol === "file:") return "./";
    var p = location.pathname;
    var bases = ["/sunglow/v2/dist", "/sunglow/v2"];
    for (var i = 0; i < bases.length; i++) {
      var b = bases[i], k = p.indexOf(b);
      if (k >= 0) {
        var after = p.slice(k + b.length);
        if (after === "" || after.charAt(0) === "/") return p.slice(0, k + b.length) + "/";
      }
    }
    return "/";
  }

  /* ---------------- 绑定 ---------------- */
  var entry = deriveEntry();
  var home = entry + "index.html" + (location.hash || "");
  var btnHome = document.getElementById("btnHome");
  if (btnHome) btnHome.setAttribute("href", home);
  var brand = document.getElementById("brand");
  if (brand) brand.setAttribute("href", home);

  /* 导航里的相对地址统一按部署根重算（深层路径也不会跑偏） */
  var navLinks = document.querySelectorAll("#nav a, .foot a");
  for (var n = 0; n < navLinks.length; n++) {
    var raw = navLinks[n].getAttribute("href");
    if (!raw) continue;
    navLinks[n].setAttribute("href", entry + raw.replace(/^\.\//, ""));
  }

  /* 请求地址只走 textContent（路径是用户可控输入） */
  var path = location.pathname + (location.search || "");
  var miss = document.getElementById("miss");
  var missTx = document.getElementById("missTx");
  if (miss && missTx && path) { missTx.textContent = path; miss.hidden = false; }

  /* 返回上一页：history.length 是唯一可靠信号 */
  var back = document.getElementById("btnBack");
  if (back && history.length > 1) {
    back.hidden = false;
    back.addEventListener("click", function () { history.back(); });
  }

  document.getElementById("langBtn").addEventListener("click", function (e) {
    e.stopPropagation(); toggleMenu("langBtn", "langMenu");
  });
  document.getElementById("themeBtn").addEventListener("click", function (e) {
    e.stopPropagation(); toggleMenu("themeBtn", "themeMenu");
  });

  var lm = document.getElementById("langMenu");
  lm.addEventListener("click", function (e) {
    var b = e.target.closest("[data-lang]");
    if (!b) return;
    lang = b.getAttribute("data-lang");
    writePref({ lang: lang });
    applyLang(); closeMenus();
  });

  var tm = document.getElementById("themeMenu");
  tm.addEventListener("click", function (e) {
    var b = e.target.closest("[data-theme-mode]");
    if (!b) return;
    themeMode = b.getAttribute("data-theme-mode");
    writePref({ theme: themeMode });
    applyTheme(); closeMenus();
  });

  document.addEventListener("click", function (e) {
    if (!e.target.closest(".pop-holder")) closeMenus();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closeMenus();
  });

  applyLang();
  applyTheme();
})();
</script>
</body>
</html>
