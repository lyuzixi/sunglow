<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0E2233">
  <title>追光航志 · GLOWCAST v3</title>
  <meta name="description" content="霞光预报 GLOWCAST · v3 追光航志 —— 指挥台式观测决策：今晚去哪拍、敢不敢信。">
  <script>
    /* 主题引导（防 FOUC）：与 state.ts 同一判定 */
    (function () {
      try {
        var p = JSON.parse(localStorage.getItem("glowcast.v3.pref") || "{}");
        var t = (p && p.theme) || "auto";
        var dark = t === "dark" || (t === "auto" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch (e) { document.documentElement.dataset.theme = "dark"; }
    })();
  </script>
</head>
<body>
  <div id="app">
    <!-- JS 跑不起来时留下的指引页（Vue 挂载后被替换） -->
    <div style="max-width:640px;margin:12vh auto;padding:0 24px;font:15px/1.8 'PingFang SC','Microsoft YaHei',sans-serif;color:#0E2233">
      <h1 style="font-size:22px">追光航志 · GLOWCAST v3</h1>
      <p>直接双击 <code>v3/index.html</code> 什么都看不到 —— 这是源码入口，浏览器不允许从本地文件加载 ES 模块。</p>
      <ul>
        <li>打开 <code>v3/standalone.html</code>（单文件版，断网可用）。</li>
        <li>或构建后打开 <code>v3/dist/index.html</code>（需静态服务：<code>cd v3 &amp;&amp; npm run preview</code>）。</li>
      </ul>
      <p><b>开发：</b><code>cd v3 &amp;&amp; npm install &amp;&amp; npm run dev</code></p>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
