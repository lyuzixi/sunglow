<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="霞光预报 GLOWCAST · 大气光谱观测站 —— 多模式晚霞/朝霞概率与观赏质量预报" />
  <meta name="theme-color" content="#070b14" />
  <title>霞光预报 GLOWCAST · 大气光谱观测站</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff4d82'/%3E%3Cstop offset='.5' stop-color='%23ff9c3f'/%3E%3Cstop offset='1' stop-color='%232ed5e8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='url(%23g)' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='5' fill='url(%23g)'/%3E%3C/svg%3E" />
</head>
<body>
  <div id="app">
    <!-- Vue 挂载后会整体替换这段内容。留在这里是为了：直接双击本文件（file://）
         时模块脚本被浏览器拦截、Vue 没跑起来，你仍然能看到下面的指引。 -->
    <div style="font-family: system-ui, sans-serif; max-width: 560px; margin: 12vh auto; padding: 0 24px; line-height: 1.8; color: #46556f;">
      <div style="width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(90deg,#ff4d82,#ff9c3f,#2ed5e8); margin-bottom: 20px;"></div>
      <h1 style="font-size: 22px; color: #111a2c; margin: 0 0 12px;">这是源码入口（开发用）</h1>
      <p>交付产物只有一个文件：<code>v2/index.html</code> —— 构建后即生成，JS/CSS/字体全部内联，双击（file://）即可离线使用。</p>
      <p><b>构建：</b><code>cd v2 &amp;&amp; npm run build</code></p>
      <p><b>开发：</b><code>cd v2 &amp;&amp; npm run dev</code>，浏览器打开 <code>/app.html</code></p>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
