<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="霞光档案 · SUNGLOW Spectrum Edition · 光谱观测版 —— 多模式晚霞/朝霞概率与观赏质量预报，让每一次追霞，都有迹可循" />
  <meta name="theme-color" content="#070b14" />
  <link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" href="./favicon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="霞光档案" />
<title>霞光档案 · SUNGLOW Spectrum Edition · 光谱观测版</title>
  <link rel="icon" type="image/png" href="./favicon-192.png" />
</head>
<body>
  <div id="app">
    <!-- Vue 挂载后会整体替换这段内容。留在这里是为了：直接双击本文件（file://）
         时模块脚本被浏览器拦截、Vue 没跑起来，你仍然能看到下面的指引。 -->
    <div style="font-family: system-ui, sans-serif; max-width: 560px; margin: 12vh auto; padding: 0 24px; line-height: 1.8; color: #46556f;">
      <div style="width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(90deg,#ff4d82,#ff9c3f,#2ed5e8); margin-bottom: 20px;"></div>
      <h1 style="font-size: 22px; color: #111a2c; margin: 0 0 12px;">这是源码入口（开发用）</h1>
      <p>交付产物只有一个文件：仓库根 <code>index.html</code> —— 构建后自动发布到根，JS/CSS/字体全部内联，双击（file://）即可离线使用。</p>
      <p><b>构建：</b><code>cd v2 &amp;&amp; npm run build</code></p>
      <p><b>开发：</b><code>cd v2 &amp;&amp; npm run dev</code>，浏览器打开 <code>/app.html</code></p>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
