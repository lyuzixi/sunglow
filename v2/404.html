<style>
/* ---- 令牌取自 v2 src/styles/tokens.css 深色态（自包含，抄值不引文件） ---- */
:root{
  --bg:#070b14;
  --card:rgba(15,23,42,.62);
  --glass:rgba(130,160,220,.06);
  --glass-2:rgba(130,160,220,.10);
  --stroke:rgba(148,178,232,.14);
  --stroke-2:rgba(148,178,232,.26);
  --tx-1:#e9eefb;
  --tx-2:#a0b1cd;
  --tx-3:#5c6c8c;
  --s1:#ff4d82; --s2:#ff9c3f; --s3:#2ed5e8;
  --spectrum:linear-gradient(100deg, var(--s1) 0%, var(--s2) 48%, var(--s3) 100%);
  --font-display:"Space Grotesk","PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  --font-body:"Inter","PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  min-height:100vh;
  display:flex; align-items:center; justify-content:center;
  padding:36px 18px;
  background:
    radial-gradient(1100px 520px at 50% -12%, rgba(255,77,130,.13), transparent 62%),
    radial-gradient(900px 460px at 88% 110%, rgba(46,213,232,.10), transparent 60%),
    radial-gradient(760px 420px at 4% 98%, rgba(255,156,63,.08), transparent 62%),
    var(--bg);
  color:var(--tx-1);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}

/* ---- 星尘：纯 CSS 点层，无脚本无请求 ---- */
.stars{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background-image:
    radial-gradient(1.4px 1.4px at 6% 12%, rgba(233,238,251,.55), transparent 70%),
    radial-gradient(1px 1px at 14% 34%, rgba(233,238,251,.38), transparent 70%),
    radial-gradient(1.8px 1.8px at 22% 8%, rgba(255,220,235,.50), transparent 70%),
    radial-gradient(1px 1px at 28% 56%, rgba(233,238,251,.30), transparent 70%),
    radial-gradient(1.2px 1.2px at 33% 22%, rgba(233,238,251,.45), transparent 70%),
    radial-gradient(1.6px 1.6px at 41% 78%, rgba(200,235,245,.42), transparent 70%),
    radial-gradient(1px 1px at 47% 15%, rgba(233,238,251,.32), transparent 70%),
    radial-gradient(1.3px 1.3px at 54% 42%, rgba(233,238,251,.50), transparent 70%),
    radial-gradient(1px 1px at 61% 6%, rgba(255,210,225,.40), transparent 70%),
    radial-gradient(1.7px 1.7px at 66% 68%, rgba(233,238,251,.45), transparent 70%),
    radial-gradient(1px 1px at 72% 30%, rgba(233,238,251,.30), transparent 70%),
    radial-gradient(1.2px 1.2px at 78% 88%, rgba(190,230,245,.40), transparent 70%),
    radial-gradient(1px 1px at 83% 18%, rgba(233,238,251,.35), transparent 70%),
    radial-gradient(1.5px 1.5px at 88% 52%, rgba(255,215,230,.42), transparent 70%),
    radial-gradient(1px 1px at 93% 74%, rgba(233,238,251,.30), transparent 70%),
    radial-gradient(1.2px 1.2px at 9% 66%, rgba(233,238,251,.36), transparent 70%),
    radial-gradient(1px 1px at 18% 88%, rgba(233,238,251,.28), transparent 70%),
    radial-gradient(1.4px 1.4px at 38% 44%, rgba(233,238,251,.22), transparent 70%),
    radial-gradient(1px 1px at 58% 92%, rgba(233,238,251,.30), transparent 70%),
    radial-gradient(1.3px 1.3px at 96% 36%, rgba(233,238,251,.38), transparent 70%);
}

/* ---- 玻璃面板 ---- */
.panel{
  position:relative; z-index:1;
  width:100%; max-width:620px;
  padding:44px 40px 34px;
  text-align:center;
  border-radius:22px;
  background:var(--card);
  border:1px solid var(--stroke);
  backdrop-filter:blur(18px) saturate(1.25);
  -webkit-backdrop-filter:blur(18px) saturate(1.25);
  box-shadow:0 18px 48px rgba(2,6,16,.55);
}
/* 顶部一道高光发丝线 */
.panel::before{
  content:""; position:absolute; top:0; left:12%; right:12%; height:1px;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent);
}

/* ---- 巨型 404：光谱渐变裁字 + 双层辉光 ---- */
.code{
  font-family:var(--font-display);
  font-size:clamp(5.2rem, 20vw, 10.5rem);
  font-weight:700;
  line-height:.95;
  letter-spacing:.02em;
  background:var(--spectrum);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 34px rgba(255,77,130,.32)) drop-shadow(0 0 70px rgba(46,213,232,.22));
}
h1{
  margin:18px 0 0;
  font-family:var(--font-display);
  font-size:clamp(1.45rem, 3.2vw, 1.9rem);
  font-weight:600;
  letter-spacing:.04em;
}
.en{
  margin:10px 0 0;
  font-size:.72rem;
  font-weight:500;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:var(--tx-3);
}
.desc{
  margin:18px auto 0;
  max-width:34em;
  font-size:.95rem;
  line-height:1.8;
  color:var(--tx-2);
  text-wrap:pretty;
}
.path{
  margin:16px 0 0;
  font-size:.78rem;
  line-height:1.6;
  color:var(--tx-3);
  word-break:break-all;
  overflow-wrap:anywhere;
}
.path code{
  font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  background:var(--glass-2);
  border:1px solid var(--stroke);
  border-radius:8px;
  padding:2px 8px;
}

/* ---- 按钮 ---- */
.acts{
  display:flex; flex-wrap:wrap; gap:12px;
  justify-content:center;
  margin:26px 0 18px;
}
.btn{
  display:inline-flex; align-items:center; justify-content:center;
  min-height:44px; padding:11px 26px;
  border-radius:999px;
  font-family:inherit; font-size:.95rem; font-weight:600;
  text-decoration:none; cursor:pointer;
  transition:transform var(--t, 160ms) cubic-bezier(.16,1,.3,1), filter 160ms, background-color 160ms;
}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn:focus-visible{outline:2px solid var(--s3); outline-offset:3px}
.btn.primary{
  border:0;
  background:var(--spectrum);
  color:#070b14;
}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{
  background:var(--glass);
  border:1px solid var(--stroke-2);
  color:var(--tx-1);
}
.btn.ghost:hover{background:var(--glass-2)}
[hidden]{display:none!important}

.hint{
  margin:0;
  font-size:.78rem;
  line-height:1.7;
  color:var(--tx-3);
}

/* ---- 移动端 ---- */
@media (max-width:560px){
  body{padding:22px 14px}
  .panel{padding:32px 22px 26px; border-radius:18px}
  .acts{flex-direction:column; align-items:stretch}
  .btn{width:100%}
}
</style>
</head>
<body>
<div class="stars" aria-hidden="true"></div>
<main class="panel">
  <div class="code" aria-hidden="true">404</div>
  <h1>页面不存在</h1>
  <p class="en">Signal lost · page not found</p>
  <p class="desc">这个地址没有对应的观测记录 —— 可能是链接过期、地址输错，或者页面已经挪走了。</p>
  <p class="path" id="miss" hidden>请求的地址 <code id="missTx"></code></p>
  <div class="acts">
    <a class="btn primary" id="btnHome" href="./index.html">返回首页</a>
    <button class="btn ghost" id="btnBack" type="button" hidden>返回上一页</button>
  </div>
  <p class="hint">回首页可继续查询朝霞与晚霞的出现概率与观赏质量。</p>
</main>
<script>
(function () {
  /* 任意深度路径兜底：本页会被托管平台应答到任意错误路径（如 /sunglow/v2/dist/foo/bar），
     相对地址会随错误路径越解析越偏（越深错得越离谱），所以从 location.pathname
     截出站点入口，再拼绝对的 index.html —— 与原版 404.html 的 data-home 同一思路，
     只是把「构建期注入」换成「运行期推导」，让本页保持零构建、单文件、任意子路径可用。 */
  function deriveEntry() {
    var p = location.pathname;
    var base = "/sunglow/v2/dist";      /* v2 在 GH Pages 项目页上的部署根 */
    var i = p.indexOf(base);
    if (i >= 0) {
      var after = p.slice(i + base.length);
      if (after === "" || after.charAt(0) === "/") return p.slice(0, i + base.length) + "/";
    }
    return "/";                          /* 根路径部署（本地 preview 等）兜底 */
  }
  var entry = deriveEntry();
  /* 首页跳推导出的 index.html，保留 hash（hash 里是 SPA 路由，丢了就回不到原视图） */
  var home = entry + "index.html" + (location.hash || "");

  var btnHome = document.getElementById("btnHome");
  if (btnHome) btnHome.setAttribute("href", home);

  /* 显示请求地址：只能走 textContent，路径是用户可控输入，拼 innerHTML 就是反射型 XSS */
  var p = location.pathname + (location.search || "");
  var miss = document.getElementById("miss");
  var missTx = document.getElementById("missTx");
  if (miss && missTx && p) { missTx.textContent = p; miss.hidden = false; }

  /* 「返回上一页」只在真有上一页时显形：history.length 是唯一能拿到的信号，
     新标签页直接进 404 时是 1，点回去只会落到空白页，不如不给。 */
  var back = document.getElementById("btnBack");
  if (back && history.length > 1) {
    back.hidden = false;
    back.addEventListener("click", function () {
      if (history.length > 1) history.back();
      else location.href = home;
    });
  }
})();
</script>
</body>
</html>
