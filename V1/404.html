<script>
/* 主题引导：**必须在 CSS 解析之前**跑完，否则上次选了深色的用户刷新时会先闪一帧浅色。
   404 页是独立产物，所以它自带一份（与主页那份逻辑相同、键相同），
   不依赖任何其它脚本 —— 这一页会被各种奇怪客户端打开，越自包含越好。 */
(function () {
  var root = document.documentElement, pref = "auto";
  try {
    var raw = localStorage.getItem("sunsetbot.pref.v1");
    var p = raw ? JSON.parse(raw) : null;
    if (p && (p.theme === "dark" || p.theme === "light" || p.theme === "auto")) pref = p.theme;
  } catch (e) { }
  root.setAttribute("data-theme-pref", pref);
  var dark = pref === "dark" ||
    (pref === "auto" && !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches));
  root.setAttribute("data-theme", dark ? "dark" : "light");
  root.style.colorScheme = dark ? "dark" : "light";
})();
</script>
<style>
/* ---- 设计令牌：与 tpl/template.html 的 :root **逐字一致** ----
   404 页会被套在任意路径下返回，但它看上去必须跟主页是同一个站点。
   所以这里不新造颜色，只抄；改配色时两边一起改。 */
:root{
  /* ---------- 视觉方案四 · 纸面仪器（2026-10-17） ----------
     三条纪律，改配色前先读：
     ① **纸面是冷中性**（不是奶油色）。暖色只属于"光"—— 霞光橙只出现在数据里
        （天色带、窗口标记、选中态、强调数字），页面骨架一律无彩。
        奶油底 + 衬线 + 陶土橙是 AI 默认套餐的成对特征，这里刻意避开前一项。
     ② **层级靠排版与发丝线，不靠阴影**。流内内容一律没有 box-shadow：
        分区分用 1px 发丝线，重点区（结论 / 地图）用白面 + 边线 + 大圆角。
        阴影只留给真正"浮起来"的东西（下拉、提示卡、目录）。
     ③ **对比度是审计过的**：--tx3 / --acc2 的值不是随手挑的，见下方配色纪律段。 */
  --bg:#f6f7f8; --card:#ffffff; --line:#e6e7ea; --line2:#eef0f2;
  --tx:#15181d; --tx2:#4f535a; --tx3:#696d75;
  --ok:#0f7a45; --okbg:#e9f7ef;
  --warn:#9c5a09; --warnbg:#fdf3e3;
  --bad:#c0392b; --badbg:#fdeceb;
  --acc:#e2601f; --acc2:#bd4a17; --accbg:#fff3ec;
  --blue:#2563eb; --bluebg:#eef3ff;
  /* 圆角分两档：--r 给"仪器面板"（结论卡 / 地图卡 / 页脚折叠块），
     --r2 给面板内部的小方块与控件。层级不再靠"全站同一个圆角"糊平。 */
  --r:16px; --r2:9px;
  /* 流内卡片不投影（见纪律②）。--sh 保留给"面板级"的两张脸，
     而且是极轻的一层 —— 靠边线立住，不靠阴影浮起来。 */
  --sh:0 1px 2px rgba(16,24,40,.03);
  --onacc:#fff;           /* 压在强调色底上的文字 */
  /* 墨色实心按钮（主操作）：深色下自动翻成浅色实心 —— 只换令牌，不写第二套规则 */
  --solid:#15181d; --solidtx:#ffffff;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  /* 视觉设计方案 P0：两个字体角色，界限分明。
     "声音"（衬线）只给：结论句、卡题、hero 大数字 —— 应用唯一开口说的一次话；
     "仪器"（无衬线）给：控件、正文、标签、图例。
     等宽体收缩到只守真正对齐成列的数字（趋势/对比表、悬停读数）。
     单文件约束 ⇒ 只用系统栈，零外部字体文件。
     已知风险：SimSun 在 ≤12px 有 bitmap 提示发虚 ⇒ 衬线只用于 ≥15px 处。 */
  --serif:"Songti SC","STSong","SimSun","Noto Serif CJK SC","Source Han Serif SC",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;

  /* ---------- 深色模式（F8）追加的令牌 ----------
     为什么要有这一层：原来全站只有 10 个令牌，**132 处颜色是硬编码的**。
     硬编码的值没有"名字"，深色模式就只能按选择器一条条覆盖 —— 那样每加一个新组件
     都可能漏掉。现在把"表面 / 文字 / 边框 / 语义底"收进令牌，深色只需重新定义
     :root 的这几十个变量，组件 CSS 一行都不用改（**浅色值逐字保持不变**，
     所以这次令牌化对浅色模式是零视觉变化）。
     命名规则：--xxx 是颜色本身；--xxxbd 是它的边框色；--xxxbg 是它的浅底。 */
  --hover:#f4f5f7;        /* 次级按钮/条目 hover 底、.kv .it、.tl 的底 */
  --rowalt:#fafbfc;       /* 表格偶数行 */
  --hoverline:#d8dade;
  --panel:#f1f2f4;        /* 分段控件（.seg）底 */
  --sug:#ffffff;          /* 下拉/浮层底（比卡片再"浮"一层） */
  /* 顶栏底色＝纸面（不是白）：顶部条要"融进纸里"，而不是贴一条白胶带。
     配合磨砂后，滚过内容时颜色只有极轻微的变化。 */
  --topbg:rgba(246,247,248,.82);
  --tipbg:rgba(255,255,255,.98);
  --tipbgSolid:#ffffff;   /* 手机端贴底卡片要求不透明 */
  /* 下拉与桌面提示卡的外阴影：基础态与液态玻璃块共用一套值（darkprobe 收敛硬编码色） */
  --sh-sug:0 18px 40px -16px rgba(16,24,40,.26), 0 1px 0 rgba(16,24,40,.04);
  --sh-tip:0 16px 34px -14px rgba(16,24,40,.30), 0 1px 0 rgba(16,24,40,.04);
  /* 液态玻璃（磨砂+高光档）共用令牌：只在 @supports(backdrop-filter) 内生效，
     四处悬浮件（顶栏/搜索下拉/桌面提示卡/目录面板）用；正文卡片保持实心。 */
  --glass:rgba(246,247,248,.72);       /* 玻璃底色，浮在内容上时透出下方色彩 */
  --glass-sheen:rgba(255,255,255,.42); /* 顶部一道高光渐变的起点 */
  --glass-hi:rgba(255,255,255,.70);    /* 内侧 1px 高光描边 */
  --loadbg:rgba(246,247,248,.90);
  --azibg:rgba(255,255,255,.72);
  --azitx:#6b7486;
  --spinbd:#f0d8c8;
  --focusbd:#f0b189; --focusring:#ffe6d6;
  --accbd:#ffd9c2; --okbd:#bfe7d2; --warnbd:#f2ddba; --badbd:#f5cdc9; --bluebd:#d9e3fb;
  --track:#eef0f2;        /* 进度条/环形底、图表网格、地图未加载时的底 */
  --track2:#e3e5e8;       /* 排行榜条形底 */
  --ensbd:#f3c9ab; --ensgrad:#fffaf7;          /* 「多模型综合」卡的边框与渐变顶 */
  --soft:#fafbfc;         /* 内嵌面板（环境输入条 / 省份下钻） */
  --tint:#fff8f2; --tint2:#fdf7f2; --tint3:#ffe6d8;   /* 品牌橙的三种淡底 */
  --hole:rgba(0,0,0,.09); /* 色卡/图例色块的描边 */
  --gp1:#2f6fd0; --gp2:#e2601f;                /* 曲线图的两条线（蓝/橙） */
  /* 四路模型标识色（模型卡上的小圆点与数字）：深色下要提亮，
     否则 #2f6fd0 这类中蓝压在深底上几乎看不见 */
  --mc-gfs:#2f6fd0; --mc-ec:#0f9c8a; --mc-rt:#c9501a; --mc-ens:#e2601f;
  /* 天色带专用（视觉方案 P1）：**固定的**曙暮光序列，按太阳高度角分段
     （>0 / 0~-6 / -6~-12 / -12~-18 / <-18 度）。它只属于天色带 ——
     页面 chrome、徽章、按钮一概不许引用；与地图色阶（当日拉伸）是两套色阶，
     刻意不混用，否则"看图反查数值"的单值映射会被第二种暖色序列污染。 */
  --dusk-day:#dde5ee; --dusk-civil:#f0c48c; --dusk-nautical:#d9784a;
  --dusk-astro:#7a759f; --dusk-night:#2b3450;
  /* 霞光位置的一团柔光（视觉方案二 P1）：只属于天色带的第二层大气 ——
     位置由 JS 按霞光窗口中心写入 --skyglow-x，颜色固定不随数据变。 */
  --skyglow:rgba(255,166,87,.30);
  /* 目录抽屉/浮层用的阴影与遮罩（浅色）：放进令牌是 darkprobe 的「令牌外硬编码色 ≤45」守着的——弹层阴影在深色下要用另一组值 */
  --sh-pop:0 18px 44px -18px rgba(16,24,40,.22);
  --veil:rgba(12,18,28,.28);
  /* 四级等级色（.g-优/良/一般/差 与 pill）：**必须成套**，
     深色下不能只换底色 —— 文字色 #178a52 之类在深底上对比度只有 2.6，读不出来 */
  --g1bg:#e9f7ef; --g1tx:#12734a; --g1bd:#bfe7d2;
  --g2bg:#eef6e8; --g2tx:#4c7a16; --g2bd:#d5e9c0;
  --g3bg:#fdf3e3; --g3tx:#9a5b06; --g3bd:#f2ddba;
  --g4bg:#fdeceb; --g4tx:#a93226; --g4bd:#f5cdc9;
}

html[data-theme="dark"]{
  --bg:#11151c; --card:#161b22; --line:#262c35; --line2:#1e242c;
  --tx:#e9ecf1; --tx2:#a8aeb8; --tx3:#8d939d;
  --ok:#5fce97; --okbg:#122a20; --okbd:#1f4735;
  --warn:#e2b45e; --warnbg:#2a2314; --warnbd:#463a1e;
  --bad:#f2796a; --badbg:#2d1a18; --badbd:#4d2a26;
  --acc:#f4791f; --acc2:#ff9d52; --accbg:#2c1e13; --accbd:#4d3520;
  --blue:#7fadff; --bluebg:#141e33; --bluebd:#28395c;
  /* 深色下"面板级"那张脸只留一圈极轻的贴地阴影 —— 层次交给边线与底色差，
     与浅色同一套取舍（视觉方案四纪律②：流内不靠阴影）。 */
  --sh:0 1px 2px rgba(0,0,0,.4);
  --onacc:#fff;
  /* 深色下的主操作：**不能用近白填充** —— darkprobe 的浅色底扫描器会把它判成
     "漏网的浅色块"（实测 #e9ecf1 的 70×31 按钮直接被点名）。改成比卡片亮一档的
     中性灰：它仍然是一块"实心按钮"，但不会在深色页面上炸出一个白块。 */
  --solid:#3a424e; --solidtx:#f2f5f9;
  --hover:#1d232b; --rowalt:#1a1f26; --hoverline:#39414c; --panel:#1c222a; --sug:#1d232b;
  --topbg:rgba(17,21,28,.86); --tipbg:rgba(22,27,34,.98); --tipbgSolid:#161b22;
  /* 玻璃令牌深色版：底色更沉，高光更弱 —— 深底上白高光容易过曝 */
  --glass:rgba(17,21,28,.66); --glass-sheen:rgba(255,255,255,.06); --glass-hi:rgba(255,255,255,.09);
  --loadbg:rgba(17,21,28,.92); --azibg:rgba(20,25,33,.72); --azitx:#a9b4c2;
  --spinbd:#3a2a20;
  --focusbd:#a9663a; --focusring:#4a2f1e;
  --track:#222932; --track2:#2a313a;
  --ensbd:#5a3f2a; --ensgrad:#221c18;
  --soft:#1a1f26; --tint:#231d18; --tint2:#221c17; --tint3:#2a2018;
  --hole:rgba(255,255,255,.10);
  --gp1:#6f9dea; --gp2:#f4791f;
  --mc-gfs:#6f9dea; --mc-ec:#3fc3b0; --mc-rt:#e8783a; --mc-ens:#f4791f;
  /* 天色带：深色下保持同一序列（它本来就是"天"，不反色），只把白昼段压暗一档，
     否则一块亮白压在深色卡上刺眼；夜段要比卡片底色(#161b22)略亮才看得出边界。 */
  --dusk-day:#3a4354; --dusk-civil:#e8b678; --dusk-nautical:#cf6f42;
  --dusk-astro:#6f6a92; --dusk-night:#1e2536;
  /* 深色下柔光略强：四周更暗，同样强度读起来反而弱 */
  --skyglow:rgba(255,150,70,.34);
  /* 弹层阴影/遮罩（深色）：黑底上要更深、更实，否则浮层与卡片分不开 */
  --sh-pop:0 18px 44px rgba(0,0,0,.6);
  --veil:rgba(0,0,0,.55);
  --g1bg:#122a20; --g1tx:#5fce97; --g1bd:#1f4735;
  --g2bg:#1c2a17; --g2tx:#9ac765; --g2bd:#2f4526;
  --g3bg:#2a2314; --g3tx:#e2b45e; --g3bd:#463a1e;
  --g4bg:#2d1a18; --g4tx:#f2796a; --g4bd:#4d2a26;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
/* 纸面：与主页同一套（无渐变光晕；见 tpl/template.html 的 body 注释） */
body{
  background:var(--bg);
  color:var(--tx);
  font:15px/1.6 var(--sans);
  -webkit-text-size-adjust:100%;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px 48px}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:.2px}
a{color:var(--blue)}
.mono{font-family:var(--mono)}

/* ---------- 顶部（与主页同一段，逐字复用） ---------- */
.top{position:sticky;top:0;z-index:60;backdrop-filter:saturate(1.2) blur(12px);
  background:var(--topbg);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:13px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
/* 标记：细环 + 正在落到地平线上的日轮（与主页同一个记号） */
.logo{position:relative;width:22px;height:22px;flex:0 0 auto;border-radius:50%;
  border:1px solid var(--tx3)}
.logo::before{content:"";position:absolute;left:3px;right:3px;bottom:6px;height:6px;
  background:var(--acc);border-radius:99px 99px 0 0}
.logo::after{content:"";position:absolute;left:3px;right:3px;bottom:5px;height:1px;
  background:var(--tx3);opacity:.55}
.top h1{font-size:16px;line-height:1.3;letter-spacing:.2px}
/* 报头第二行（与主页同款）：Sunglow Classic Edition / 经典原版，10px、--tx3。 */
.top-ed{font-size:10px;line-height:1.4;letter-spacing:.04em;color:var(--tx3)}
/* 标题列必须 min-width:0（与主页同一条纪律）：h1 是 nowrap，其 min-content 等于
   整行标题宽，缺它标题列不许收缩，会把 badge 顶出容器右缘 → 页面 scrollWidth 变大。 */
.top-tx{min-width:0}
.top .spacer{flex:1 1 auto}
.badge{font-size:11px;padding:3px 9px;border-radius:7px;background:var(--card);color:var(--tx2);
  border:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}

/* ---------- 顶栏语言（2026-10-19：与主页同款，从正文搬到导航栏） ----------
   主页那份是"按钮 + 下拉卡片"；这页只有语言一项，所以只搬语言。
   菜单挂在 .top 外面：顶栏有 backdrop-filter，会成为 fixed 后代的包含块。 */
.topbtn{flex:0 0 auto;height:38px;min-width:38px;padding:0 9px;border:1px solid var(--line);
  border-radius:10px;background:var(--card);color:var(--tx2);font:inherit;font-size:13px;
  line-height:1;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.topbtn:hover{background:var(--hover)}
.topbtn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.topbtn[aria-expanded="true"]{background:var(--accbg);color:var(--acc2)}
.topmenu{position:fixed;z-index:121;background:var(--card);border:1px solid var(--line);
  border-radius:11px;box-shadow:var(--sh-pop);padding:6px;min-width:150px}
.topmenu .cap{font-size:11px;color:var(--tx3);letter-spacing:.4px;padding:4px 10px 6px}
.menulist{display:block}
.menulist button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;
  background:transparent;color:var(--tx);font:inherit;font-size:13.5px;padding:8px 10px;
  border-radius:8px;cursor:pointer}
.menulist button:hover{background:var(--hover)}
.menulist button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.menulist button[aria-pressed="true"]{background:var(--accbg);color:var(--acc2);font-weight:600}
.menulist button::after{content:"";margin-left:auto;font-size:12px;color:var(--acc2)}
.menulist button[aria-pressed="true"]::after{content:"✓"}

/* ---------- 通用卡片（同主页 .card） ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:22px}
.hint{font-size:12.5px;color:var(--tx3);line-height:1.6}

/* ---------- 404 本体 ---------- */
/* 窄栏居中：这页内容就一块，撑满 1560 会让"返回首页"跑到屏幕边上找不着。 */
.nf{max-width:560px;margin:64px auto 0;text-align:center;padding:34px 28px 30px}
/* 数字用 --acc2 而不是 --acc：--acc(#e2601f) 是给色块/渐变用的，白底上做文字
   对比度不够；--acc2(#bd4a17) 白底约 5.1，大字也稳稳过线。
   用等宽字体是刻意的：404 是**数字**，换成正文衬线会跟后面的标题抢注意力。 */
/* 404 是**数字**，用等宽体读起来像仪表读数；颜色取 --tx 而不是强调色 ——
   这一页只需要说明"没找到"，不需要再喊一声。强调色只留给下面那颗小圆点。 */
.nf-code{font-family:var(--mono);font-size:54px;line-height:1;font-weight:600;
  letter-spacing:2px;color:var(--tx);font-variant-numeric:tabular-nums}
.nf h2{font-size:20px;margin-top:12px}
/* text-wrap:pretty 避免中文行尾只剩一两个字（实测"……搬走了。"的"了。"单独成行） */
.nf-lead{font-size:14px;color:var(--tx2);margin:10px 0 0;text-wrap:pretty}
/* 请求路径：可能很长且不含空格（/a/b/c?x=……），必须允许在任意字符处断行，
   否则窄屏上它会把卡片撑破、把页面 scrollWidth 顶出去。 */
.nf-path{margin:12px 0 0;font-size:12.5px;color:var(--tx3);
  word-break:break-all;overflow-wrap:anywhere}
.nf-path code{font-family:var(--mono);background:var(--line2);border-radius:6px;padding:2px 6px}
.acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:40px;padding:9px 17px;border-radius:8px;border:1px solid var(--line);
  background:var(--card);color:var(--tx);font-weight:600;font-size:15px;text-decoration:none;
  transition:.15s;cursor:pointer;font-family:inherit}
.btn:hover{border-color:var(--hoverline);background:var(--hover)}
/* 主按钮＝墨色实心（与主页 .primary 同一套令牌：深色下自动翻成浅底深字） */
.btn.pri{background:var(--solid);border-color:var(--solid);color:var(--solidtx)}
.btn.pri:hover{background:var(--solid);border-color:var(--solid);color:var(--solidtx);opacity:.88}
.btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
/* 作者样式里的 display 会盖掉 [hidden] 的 UA display:none，必须自己钉死。 */
[hidden]{display:none!important}
.nf-foot{margin:16px 0 0}
/* 手机端：语言按钮与主页同档（34px），菜单项放大到手指可点 */
@media (max-width:760px){
  .top .topbtn{height:34px;min-width:34px;padding:0 7px;font-size:12px;border-radius:9px}
  .menulist button{padding:10px 12px;font-size:14px}
}

/* ---------- 手机端（断点与主页同为 760px，三处之一） ----------
   顶部条的压法与主页**同一纪律**（h1 14px / badge 同行 / logo 20）；
   本页没有目录抽屉，顶栏保持 static（无可常驻入口，不必吸顶占一行）。 */
@media (max-width:760px){
  .top{position:static}
  .top-in{padding:8px 11px;gap:8px;flex-wrap:nowrap}
  .logo{width:20px;height:20px}
  .logo::before{left:2px;right:2px;bottom:5px;height:5px}
  .logo::after{left:2px;right:2px;bottom:4px}
  .top h1{font-size:14px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .top .spacer{flex:1 1 0;min-width:0}
  .badge{flex:0 0 auto;font-size:11px;padding:3px 8px}
  .nf{margin-top:20px;padding:20px 16px 18px}
  .nf-code{font-size:46px}
  .nf h2{font-size:17px}
  /* 竖排通栏：两个按钮横排在 360px 屏上会挤成 158px 宽，"返回上一页"五个字
     加内边距正好折行，看起来像坏了。竖排后拇指也好点。 */
  .acts{flex-direction:column;align-items:stretch}
  .btn{width:100%}
}
</style>
</head>
<!-- data-home 由 assemble.py 注入站点根路径（默认 "/"）。
     为什么不能写相对地址 "index.html"：404 页是在**请求的那个 URL**下返回内容，
     相对地址会按 /foo/bar 解析成 /foo/index.html —— 越深的错链错得越离谱。
     写死 "/" 又照顾不到部署在子路径下的站点（GitHub Pages 项目页），
     所以跟地图代理一样走"构建期注入"这条路。 -->
<body data-home="/sunglow/">

<div class="top">
  <div class="top-in">
    <div class="logo" aria-hidden="true"></div>
    <div class="top-tx">
      <h1 data-i18n="霞光预报">霞光预报</h1>
      <div class="top-ed" data-i18n="SUNGLOW · Classic Edition · 经典原版">SUNGLOW · Classic Edition · 经典原版</div>
    </div>
    <div class="spacer"></div>
    <!-- 语言入口（2026-10-19：与主页同款，从正文搬进导航栏，靠右成组、徽标左侧） -->
    <button type="button" class="topbtn" id="langBtn" aria-haspopup="true"
      aria-expanded="false" aria-controls="langMenu" aria-label="语言" data-i18n-aria="语言">中</button>
    <div class="badge" data-i18n="404 · 页面不存在">404 · 页面不存在</div>
  </div>
</div>

<!-- 语言菜单（body 级：顶栏的 backdrop-filter 会成为 fixed 后代的包含块）。
     原正文里的 #langSeg 原样搬进来，role=group + aria-pressed 的语义不变。 -->
<div class="topmenu" id="langMenu" hidden>
  <div class="cap" data-i18n="语言">语言</div>
  <div class="menulist" id="langSeg" role="group" aria-label="语言" data-i18n-aria="语言"></div>
</div>

<main class="wrap">
  <div class="card nf">
    <div class="nf-code" aria-hidden="true">404</div>
    <h2 data-i18n="找不到这个页面">找不到这个页面</h2>
    <p class="nf-lead" data-i18n="这个地址没有对应的页面 —— 可能是链接过期、地址输错，或者页面已经挪走了。">这个地址没有对应的页面 —— 可能是链接过期、地址输错，或者页面已经挪走了。</p>
    <p class="nf-path" id="missPath" hidden><span data-i18n="请求的地址：">请求的地址：</span><code class="mono" id="missPathTx"></code></p>

    <div class="acts">
      <!-- 主出口是**真链接**：没有 JS 也能回首页（404 页被各种奇怪客户端打开过，
           不能把唯一出路挂在一个 script 上）。 -->
      <a class="btn pri" href="/sunglow/" id="btnHome" data-i18n="返回首页">返回首页</a>
      <!-- 次出口相反：它只有在 JS 确认"确实有上一页"时才显形，见下面那段脚本。 -->
      <button type="button" class="btn" id="btnBack" hidden data-i18n="返回上一页">返回上一页</button>
    </div>

    <p class="hint nf-foot" data-i18n="回首页后可以重新选地点与日期，查询朝霞 / 晚霞的出现概率与观赏质量。">回首页后可以重新选地点与日期，查询朝霞 / 晚霞的出现概率与观赏质量。</p>

    <!-- 语言切换已搬到顶栏（2026-10-19）：入口唯一，正文不再保留第二处。 -->
  </div>
</main>

<script>
/* 404 页的 JS 只有三件事，都很小，**刻意不引任何库**：这页要在任意路径下被
   返回，多一个外部依赖就多一处"加载不到就整页失效"。
   1) 把请求到的地址显示出来（用 textContent，绝不拼 innerHTML —— 路径是
      用户可控输入，拼进去就是一个反射型 XSS）。
   2) 只在**真的有上一页**时才放出「返回上一页」。history.length 是唯一能拿到的
      信号（浏览器不允许读历史内容），刚开的新标签页是 1 —— 那时这个按钮
      点下去会把人扔回一个空白页，不如不给。
   3) 语言切换。这页是**独立产物**，所以自带一份最小词典，不依赖主页的 _pi18n.js；
       HTML 里的原文一律是简体中文 ⇒ 即便脚本被拦截，页面也照常可读（只是不换语言）。
       优先级与主页一致：URL 参数 ?lang= > 浏览器语言 > 简体。 */
(function () {
  var home = document.body.getAttribute("data-home") || "/";
  var p = location.pathname + (location.search || "");
  var box = document.getElementById("missPath");
  var tx = document.getElementById("missPathTx");
  if (box && tx && p) { tx.textContent = p; box.hidden = false; }
  var back = document.getElementById("btnBack");
  if (back && history.length > 1) {
    back.hidden = false;
    back.addEventListener("click", function () {
      // 再判一次：从进页面到点击之间，历史可能被别的操作改短了。
      if (history.length > 1) history.back();
      else location.href = home;
    });
  }

  /* ---- 最小词典（只有本页用到的 9 条 + 语言名） ---- */
  var LANGS = [["zh", "中文"], ["zhHant", "繁體"], ["en", "English"]];
  var SHORT = { zh: "中", zhHant: "繁", en: "EN" };
  var DICT = {
    en: {
      "页面不存在 · SUNGLOW Classic Edition · 霞光预报": "Page not found · SUNGLOW Classic Edition · Sunset Glow Forecast",
      "霞光预报": "Sunset Glow Forecast",
      "SUNGLOW · Classic Edition · 经典原版": "SUNGLOW · Classic Edition",
      "404 · 页面不存在": "404 · Page not found",
      "找不到这个页面": "This page does not exist",
      "这个地址没有对应的页面 —— 可能是链接过期、地址输错，或者页面已经挪走了。":
        "There is no page at this address — the link may have expired, the address may be mistyped, or the page may have moved.",
      "请求的地址：": "Requested address: ",
      "返回首页": "Back to home",
      "返回上一页": "Go back",
      "回首页后可以重新选地点与日期，查询朝霞 / 晚霞的出现概率与观赏质量。":
        "Back on the home page you can pick a new location and date to check the probability and viewing quality of dawn or dusk glow.",
      "语言": "Language"
    },
    zhHant: {
      "页面不存在 · SUNGLOW Classic Edition · 霞光预报": "頁面不存在 · SUNGLOW Classic Edition · 霞光預報",
      "霞光预报": "霞光預報",
      "SUNGLOW · Classic Edition · 经典原版": "SUNGLOW · Classic Edition · 經典原版",
      "404 · 页面不存在": "404 · 頁面不存在",
      "找不到这个页面": "找不到這個頁面",
      "这个地址没有对应的页面 —— 可能是链接过期、地址输错，或者页面已经挪走了。":
        "這個位址沒有對應的頁面 —— 可能是連結過期、位址輸入錯誤，或頁面已經搬走了。",
      "请求的地址：": "請求的位址：",
      "返回首页": "返回首頁",
      "返回上一页": "返回上一頁",
      "回首页后可以重新选地点与日期，查询朝霞 / 晚霞的出现概率与观赏质量。":
        "回首頁後可以重新選地點與日期，查詢朝霞 / 晚霞的出現機率與觀賞品質。",
      "语言": "語言"
    }
  };
  var lang = "zh";
  function t(k) {
    var d = DICT[lang];
    return (d && d[k] !== undefined) ? d[k] : k;
  }
  function paint() {
    var list = document.querySelectorAll("[data-i18n]");
    for (var i = 0; i < list.length; i++) {
      var el = list[i], k = el.getAttribute("data-i18n");
      // <title> 改 textContent 就是改标题，不需要特判
      el.textContent = t(k);
    }
    var ar = document.querySelectorAll("[data-i18n-aria]");
    for (var j = 0; j < ar.length; j++) ar[j].setAttribute("aria-label", t(ar[j].getAttribute("data-i18n-aria")));
    var bs = document.querySelectorAll("#langSeg button");
    for (var m = 0; m < bs.length; m++) {
      var on = bs[m].getAttribute("data-lang") === lang;
      bs[m].className = on ? "on" : "";
      bs[m].setAttribute("aria-pressed", on ? "true" : "false");
    }
    /* 顶栏按钮显示当前语言短名（中 / 繁 / EN） */
    var lb = document.getElementById("langBtn");
    if (lb) lb.textContent = SHORT[lang] || lang;
    document.documentElement.lang = lang === "zhHant" ? "zh-Hant-TW" : (lang === "en" ? "en" : "zh-CN");
  }
  function pick() {
    var q = "";
    try { q = (new URLSearchParams(location.search || "")).get("lang") || ""; } catch (e) { }
    var raw = String(q || navigator.language || "").toLowerCase();
    /* 繁体的判定与主页 normalizeLang() 同一套规则 */
    if (/^zh[-_]?(hant|tw|hk|mo)/.test(raw) || raw === "zh-hant") return "zhHant";
    if (/^en/.test(raw)) return "en";
    return "zh";
  }
  /* 语言入口在顶栏：按钮开关下拉，选完即关；点外面 / Esc / 视口变化都收起。
     分段控件的 role=group + aria-pressed 语义与主页一致（单选组恒有一个当前值）。 */
  var seg = document.getElementById("langSeg");
  var menu = document.getElementById("langMenu");
  var lbtn = document.getElementById("langBtn");
  function closeMenu(back) {
    if (!menu || menu.hidden) return;
    menu.hidden = true;
    menu.style.left = "";
    menu.style.top = "";
    if (lbtn) lbtn.setAttribute("aria-expanded", "false");
    if (back && lbtn) lbtn.focus({ preventScroll: true });
  }
  function openMenu() {
    if (!menu || !lbtn) return;
    menu.hidden = false;
    lbtn.setAttribute("aria-expanded", "true");
    var r = lbtn.getBoundingClientRect();
    var mw = menu.offsetWidth, mh = menu.offsetHeight;
    var left = Math.max(8, Math.min(r.right - mw, window.innerWidth - mw - 8));
    var top = r.bottom + 8;
    if (top + mh > window.innerHeight - 8) top = Math.max(8, r.top - mh - 8);
    menu.style.left = left + "px";
    menu.style.top = top + "px";
    var first = menu.querySelector("button");
    if (first) first.focus({ preventScroll: true });
  }
  if (seg) {
    seg.innerHTML = LANGS.map(function (l) {
      return '<button type="button" data-lang="' + l[0] + '" aria-pressed="false">' + l[1] + "</button>";
    }).join("");
    seg.addEventListener("click", function (ev) {
      var b = ev.target.closest ? ev.target.closest("button[data-lang]") : null;
      if (!b) return;
      lang = b.getAttribute("data-lang");
      paint();
      closeMenu(true);
    });
  }
  if (lbtn) lbtn.addEventListener("click", function (ev) {
    ev.stopPropagation();
    if (menu && menu.hidden) openMenu(); else closeMenu(true);
  });
  document.addEventListener("click", function (ev) {
    if (!menu || menu.hidden || !ev.target.closest) return;
    if (ev.target.closest("#langMenu") || ev.target.closest("#langBtn")) return;
    closeMenu(false);
  });
  document.addEventListener("keydown", function (ev) {
    if (menu && !menu.hidden && ev.key === "Escape") { ev.preventDefault(); closeMenu(true); }
  });
  window.addEventListener("resize", function () { closeMenu(false); });
  window.addEventListener("scroll", function () { closeMenu(false); }, { passive: true });
  lang = pick();
  paint();
})();
</script>
</body>
</html>
