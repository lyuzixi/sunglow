# SUNGLOW 原生安卓 App · 云端构建
#
# 设计要点：
#   · 本机不装 Android Studio / SDK，编译全部交给 GitHub 的 Linux 机器
#   · 不做 Gradle wrapper（二进制 jar 无法在无 Gradle 环境下生成），
#     由 gradle/actions/setup-gradle 提供指定版本的 Gradle
#   · Android SDK 直接用 runner 镜像自带的那一份（/usr/local/lib/android/sdk），
#     不再依赖 setup-android 在线下载，少一个网络失败点
#   · 单测与基准测试（GoldenTest）先跑，失败即停，不产出"看着像成功"的包
#   · debug APK 作为构建产物挂出，供真机安装验证

name: android

on:
  push:
    paths:
      - "native/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "native/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -d "$SDK" ]; then
            echo "::error::Android SDK not found at $SDK"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" || true
          echo "platforms:" && ls "$SDK/platforms"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      # 基准数据不入库：每次构建都从仓库里的 v2 TypeScript 源码实时生成，
      # 这样算法口径一旦改动，基准与原生实现会同时更新，不会出现"按旧基准通过"。
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate algorithm baseline (golden)
        working-directory: .
        run: npx --yes tsx native/tools/gen-golden.mjs

      # 城市表同样从网页端源码生成到 assets，避免在原生端再维护一份城市清单
      - name: Generate city catalog
        working-directory: .
        run: npx --yes tsx native/tools/gen-cities.mjs

      - name: Unit tests (含算法基准对拍)
        shell: bash
        run: set -o pipefail; gradle :app:testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee build.log

      # 失败时把编译错误与单测 XML 摘要挂到运行页，免登录即可定位
      - name: Show build failures
        if: failure()
        run: |
          echo "## 构建诊断" >> "$GITHUB_STEP_SUMMARY"
          if [ -f build.log ]; then
            grep -E "^e: " build.log | head -8 | while IFS= read -r line; do
              echo "::error title=Kotlin::$line"
            done
            grep -E "(FAILURE:|error:)" build.log | head -5 | while IFS= read -r line; do
              echo "::error title=Build::$line"
            done
          fi
          DIR=app/build/test-results/testDebugUnitTest
          if [ -d "$DIR" ]; then
            for f in "$DIR"/*.xml; do
              echo "### $f" >> "$GITHUB_STEP_SUMMARY"
              head -c 3000 "$f" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
            done
          fi

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: native/app/build/reports/tests/
          if-no-files-found: ignore

      - name: Assemble debug APK
        shell: bash
        run: set -o pipefail; gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee -a build.log

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sunglow-debug-apk
          path: native/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # 产物挂到 Releases：免登录就能下载，装到手机上也方便
      - name: Publish debug APK to release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: SUNGLOW 内测包
          prerelease: true
          files: native/app/build/outputs/apk/debug/*.apk